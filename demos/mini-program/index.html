border-radius:24rpx;padding:28rpx;margin:22rpx 0}.big{font-size:68rpx;font-weight:700;color:#00e9a2}.muted{color:#90a9b6}.row{display:flex;gap:16rpx;justify-content:space-between;align-items:center}.row>view{flex:1}button{background:#00d99a;color:#061a15;border:0;border-radius:16rpx;font-size:26rpx;margin:18rpx 0}input{padding:22rpx;background:#07151e;border:1rpx solid #38515a;border-radius:12rpx;margin:18rpx 0}picker{padding:20rpx;background:#091923;border-radius:12rpx}.metric{font-size:36rpx;color:#d7fff0}.status{color:#00e9a2;margin:15rpx 0}.empty{padding:24rpx;color:#90a9b6}","project.config.json":"{\n  \"appid\": \"touristappid\",\n  \"projectname\": \"FitFuel-Foundation\",\n  \"compileType\": \"miniprogram\",\n  \"miniprogramRoot\": \"./\",\n  \"setting\": {\n    \"es6\": true,\n    \"minified\": true,\n    \"postcss\": true\n  }\n}","sitemap.json":"{\"rules\":[{\"action\":\"allow\",\"page\":\"*\"}]}","core/appearance.js":"'use strict';\nconst KEY='fitfuel_appearance_v1';\nconst OPTIONS={\n  hairStyle:[{id:'short',label:'短发'},{id:'curly',label:'卷发'},{id:'ponytail',label:'马尾'},{id:'long',label:'中长发'}],\n  skin:[{id:'peach',label:'浅暖',color:'#edb78c'},{id:'warm',label:'暖棕',color:'#ca9165'},{id:'deep',label:'深棕',color:'#966344'},{id:'dark',label:'浓棕',color:'#694a39'}],\n  hair:[{id:'chestnut',label:'栗棕',color:'#62412d'},{id:'black',label:'自然黑',color:'#292820'},{id:'auburn',label:'赤棕',color:'#9c5237'},{id:'silver',label:'银灰',color:'#a7a69e'}],\n  shirt:[{id:'cream',label:'奶白',color:'#e8dfcf'},{id:'sage',label:'鼠尾草',color:'#6c8968'},{id:'mint',label:'薄荷',color:'#459b86'},{id:'clay',label:'陶橙',color:'#c47d59'},{id:'blue',label:'雾蓝',color:'#577c9a'}],\n  pants:[{id:'charcoal',label:'炭灰',color:'#40434a'},{id:'navy',label:'深蓝',color:'#344f68'},{id:'sand',label:'沙色',color:'#9c8568'}],\n  build:[{id:'balanced',label:'匀称'},{id:'slender',label:'清瘦'},{id:'broad',label:'宽实'}]\n};\nconst copy=v=>JSON.parse(JSON.stringify(v));\nfunction initial(){return {schemaVersion:1,name:'我的分身',hairStyle:'short',skin:'peach',hair:'chestnut',shirt:'sage',pants:'charcoal',build:'balanced'}}\nfunction validate(value){\n  if(!value||Array.isArray(value)||value.schemaVersion!==1)throw Error('分身外观版本无法读取，原设置已保留');\n  if(typeof value.name!=='string'||!value.name.trim()||Array.from(value.name).length>12||/[\\u0000-\\u001f\\u007f]/.test(value.name))throw Error('分身名字需为1–12个字符');\n  for(const key of Object.keys(OPTIONS))if(!OPTIONS[key].some(x=>x.id===value[key]))throw Error('分身外观选项无法读取，原设置已保留');\n  return {schemaVersion:1,name:value.name.trim(),...Object.fromEntries(Object.keys(OPTIONS).map(k=>[k,value[k]]))};\n}\nfunction color(key,id){return OPTIONS[key]?.find(x=>x.id===id)?.color}\nfunction createAppearance(adapter){\n  function read(){\n    let raw;try{raw=adapter.getRaw(KEY)}catch{throw Error('无法读取分身外观，请重试')}\n    if(raw===null||raw===undefined||raw==='')return initial();\n    try{return validate(typeof raw==='string'?JSON.parse(raw):copy(raw))}\n    catch(error){throw Error(error.message==='分身外观版本无法读取，原设置已保留'?error.message:'分身外观损坏，原设置已保留，请重试')}\n  }\n  return {read,save(value){\n    // Refuse to overwrite unreadable/future state. This key has no health or reward writes.\n    read();const next=validate(value);\n    try{adapter.setRaw(KEY,JSON.stringify(next))}catch{throw Error('外观未能确认保存，请重试；健身记录不受影响')}\n    return copy(next);\n  }};\n}\nmodule.exports={KEY,OPTIONS,initial,validate,color,createAppearance};\n","core/avatar-controller.js":"\"use strict\";\nconst State=require('./avatar-state');\nconst KEY='fitfuel_avatar_v1',MAX_EVENT_AGE_MS=30000,FEEDBACK_MS=2500;\nconst copy=value=>JSON.parse(JSON.stringify(value));\n\n// This controller receives event references only. All writes target its own key.\nmodule.exports=function createAvatar(adapter,eventSource,{now=Date.now}={}){\n  let cold=true,pending=null;\n  function load(){\n    let raw;try{raw=adapter.getRaw(KEY)}catch{throw Error('无法读取伙伴状态，请重试；原数据已保留')}\n    if(raw===null||raw===undefined||raw==='')return State.initialState();\n    let state;try{state=typeof raw==='string'?JSON.parse(raw):copy(raw)}catch{throw Error('伙伴状态损坏，已保留原数据')}\n    return State.validateState(state);\n  }\n  function write(state){try{adapter.setRaw(KEY,JSON.stringify(state))}catch{throw Error('伙伴状态未保存，请重试；健身记录不受影响')}}\n  function run(action,mode){\n    try{\n      const time=now();if(!Number.isSafeInteger(time)||time<0)throw Error('无法读取当前时间');\n      const old=load(),next=copy(old),events=eventSource();\n      if(!Array.isArray(events))throw Error('无法读取伙伴所需的已提交事件');\n      let feedback=pending?{...pending}:null;\n      for(const e of events){\n        if(!e||e.schemaVersion!==2||!['meal','training','weight'].includes(e.recordType)||typeof e.recordId!=='string'||!e.recordId||\n          !Number.isSafeInteger(e.revision)||e.revision<1||!['create','update','delete'].includes(e.operation))continue;\n        const key=e.recordType+':'+e.recordId;\n        if(e.revision<=(next.seen[key]||0))continue;\n        next.seen[key]=e.revision;\n        if(feedback?.key===key)feedback=null;\n        const occurred=Date.parse(e.occurredAt),age=time-occurred;\n        if(!cold&&old.mode==='animated'&&e.operation==='create'&&['meal','training'].includes(e.recordType)&&\n          e.recordLocalDate===State.recordDate(time)&&Number.isFinite(age)&&age>=0&&age<MAX_EVENT_AGE_MS){\n          feedback={key,kind:e.recordType==='meal'?'eating':'completed',recordType:e.recordType,recordId:e.recordId,revision:e.revision,\n            expiresAt:occurred+MAX_EVENT_AGE_MS,startedAt:null};\n        }\n      }\n      let result=action?State.transition(next,action,time):next;\n      if(mode!==undefined){if(!State.MODES.includes(mode))throw Error('请选择有效的伙伴显示方式');result.mode=mode}\n      // Persist the receipt before exposing feedback. Ambiguous saves may skip a visual; health data is never written here.\n      if(JSON.stringify(old)!==JSON.stringify(result))write(result);\n      if(result.mode!=='animated'||feedback?.expiresAt<=time)feedback=null;\n      if(feedback&&result.activity.phase==='idle'&&feedback.startedAt===null){feedback.startedAt=time;feedback.expiresAt=Math.min(feedback.expiresAt,time+FEEDBACK_MS)}\n      pending=feedback;cold=false;\n      return State.project(result,time,pending);\n    }catch(error){pending=null;throw error}\n  }\n  return {refresh:()=>run(),dispatch:action=>run(action),setMode:mode=>run(undefined,mode),snapshot:()=>copy(load()),suspend(){pending=null}};\n};\n","core/avatar-state.js":"\"use strict\";\n\nconst MODES=['animated','static','hidden'];\nconst PHASES=['idle','preparing','training','resting','paused'];\nconst copy=value=>JSON.parse(JSON.stringify(value));\nconst object=value=>value&&typeof value==='object'&&!Array.isArray(value);\nconst nonnegative=value=>Number.isSafeInteger(value)&&value>=0;\nconst duration=value=>Number.isSafeInteger(value)&&value>=1000&&value<=600000;\n\nfunction initialState(){return {schemaVersion:1,mode:'animated',activity:{phase:'idle'},seen:{}}}\nfunction validateState(state){\n  if(!object(state)||state.schemaVersion!==1||!MODES.includes(state.mode)||!object(state.activity)||\n    !PHASES.includes(state.activity.phase)||!object(state.seen)||Object.values(state.seen).some(r=>!Number.isSafeInteger(r)||r<1))throw Error('伙伴状态版本或结构异常，已保留原数据');\n  const a=state.activity;\n  if(a.phase!=='idle'&&(typeof a.sessionId!=='string'||!a.sessionId.trim()||a.sessionId.length>160))throw Error('伙伴训练状态异常，已保留原数据');\n  if(a.phase==='resting'&&(!nonnegative(a.restUntil)||!duration(a.restDurationMs)))throw Error('伙伴休息状态异常，已保留原数据');\n  if(a.phase==='paused'&&(!['preparing','training','resting'].includes(a.resumeTo)||\n    (a.resumeTo==='resting'&&(!duration(a.restDurationMs)||!nonnegative(a.remainingMs)||a.remainingMs>a.restDurationMs))))throw Error('伙伴暂停状态异常，已保留原数据');\n  return state;\n}\nfunction remainingRestMs(state,now){\n  const a=state.activity;\n  if(a.phase==='paused'&&a.resumeTo==='resting')return a.remainingMs;\n  return a.phase==='resting'?Math.min(a.restDurationMs,Math.max(0,a.restUntil-now)):0;\n}\nconst ALLOWED={PREPARE:['idle'],START:['preparing'],REST:['training'],PAUSE:['preparing','training','resting'],\n  RESUME:['paused'],CONTINUE:['resting'],CANCEL:PHASES};\nfunction transition(state,action,now){\n  validateState(state);\n  if(!nonnegative(now))throw Error('无法读取当前时间');\n  const a=state.activity,type=action?.type;\n  if(!ALLOWED[type]?.includes(a.phase))throw Error('当前状态不能执行此操作，请确认准备、训练或暂停状态');\n  const next=copy(state),sessionId=a.sessionId;\n  switch(type){\n    case 'PREPARE':\n      if(typeof action.sessionId!=='string'||!action.sessionId.trim()||action.sessionId.length>160)throw Error('请提供有效的训练会话编号');\n      next.activity={phase:'preparing',sessionId:action.sessionId};break;\n    case 'START':case 'CONTINUE':next.activity={phase:'training',sessionId};break;\n    case 'REST':{\n      const seconds=Number(action.seconds);if(!Number.isInteger(seconds)||seconds<1||seconds>600)throw Error('休息时间需为 1–600 秒');\n      next.activity={phase:'resting',sessionId,restDurationMs:seconds*1000,restUntil:now+seconds*1000};break;\n    }\n    case 'PAUSE':\n      next.activity={phase:'paused',sessionId,resumeTo:a.phase,...(a.phase==='resting'?{remainingMs:remainingRestMs(state,now),restDurationMs:a.restDurationMs}:{})};break;\n    case 'RESUME':\n      next.activity={phase:a.resumeTo,sessionId,...(a.resumeTo==='resting'?{restUntil:now+a.remainingMs,restDurationMs:a.restDurationMs}:{})};break;\n    case 'CANCEL':next.activity={phase:'idle'};break;\n  }\n  return validateState(next);\n}\nfunction project(state,now,feedback=null){\n  validateState(state);\n  const phase=state.activity.phase,remaining=remainingRestMs(state,now);\n  const visible=state.mode==='animated'&&phase==='idle'&&feedback&&['eating','completed'].includes(feedback.kind)&&feedback.expiresAt>now?feedback:null;\n  return {displayMode:state.mode,state:state.mode==='animated'?(phase!=='idle'?phase:visible?.kind||'idle'):state.mode,\n    activity:phase,sessionId:state.activity.sessionId||null,remainingRestMs:remaining,isRestOver:phase==='resting'&&remaining===0,\n    feedback:visible?{kind:visible.kind,recordType:visible.recordType,recordId:visible.recordId,revision:visible.revision}:null};\n}\nfunction recordDate(now){const d=new Date(now);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}\n\nmodule.exports={MODES,initialState,validateState,transition,remainingRestMs,project,recordDate};\n","core/calculator.js":"\"use strict\";\nconst FitCalc = (() => {\n  const safeNumber=(v,fallback=0)=>v!==''&&v!==null&&Number.isFinite(Number(v))?Number(v):fallback;\n  const clamp=(v,min,max)=>Math.max(min,Math.min(max,safeNumber(v,min)));\n  const round=(v,d=0)=>Math.round(safeNumber(v)*10**d)/10**d;\n  const valid=(v,min,max,int=false)=>v!==''&&v!==null&&Number.isFinite(Number(v))&&Number(v)>=min&&Number(v)<=max&&(!int||Number.isInteger(Number(v)));\n  const calculateBMI=(w,h)=>valid(w,30,300)&&valid(h,100,250)?Number(w)/(Number(h)/100)**2:0;\n  const calculateBMR=(p)=>10*p.weight+6.25*p.height-5*p.age+(p.gender==='female'?-161:5);\n  const calculateTDEE=(p)=>calculateBMR(p)*p.activityLevel;\n  const calculateTargetCalories=(p)=>Math.max(0,calculateTDEE(p)+(p.goal==='cut'?-400:p.goal==='bulk'?400:0));\n  const calculateMacros=(p)=>{const target=calculateTargetCalories(p);const protein=round(p.weight*(p.goal==='cut'?2.2:p.goal==='bulk'?1.8:2));const fat=round(target*.25/9);const carb=Math.max(0,round((target-protein*4-fat*9)/4));return{protein,fat,carb,target:round(target)}};\n  const calculateCardioCalories=(met,w,min)=>valid(met,.1,30)&&valid(w,30,300)&&valid(min,1,600)?Number(met)*3.5*Number(w)/200*Number(min):0;\n  const calculateOneRM=(w,r)=>valid(w,.1,500)&&valid(r,1,12,true)?Number(w)*(1+Number(r)/30):0;\n  const calculateStrengthCalories=(ex,sets,reps,load,bw)=>{if(!ex||!valid(sets,1,30,true)||!valid(reps,1,180,true)||!valid(load,0,500)||!valid(bw,30,300))return 0;return Math.round(ex.met*1.05*bw*(sets*2.5/60)*(1+Math.min(.35,Math.min(1.2,load/bw)*.28)))};\n  const calculateFFMI=(p)=>p.weight*(1-p.bodyFat/100)/(p.height/100)**2;\n  const bmiCategory=(v)=>v<18.5?'偏低':v<25?'参考正常范围':v<30?'偏高':'较高';\n  const totals=(items)=>items.reduce((sum,m)=>{for(const k of ['kcal','protein','fat','carb'])sum[k]+=safeNumber(m[k]);return sum},{kcal:0,protein:0,fat:0,carb:0});\n  const meal=(food,grams,slot,date)=>({id:Date.now().toString(36)+Math.random().toString(36).slice(2,8),date,slot,name:food.name,grams:Number(grams),...Object.fromEntries(['kcal','protein','fat','carb'].map(k=>[k,round(safeNumber(food[k])*Number(grams)/100,2)]))});\n  return {safeNumber,clamp,round,valid,calculateBMI,calculateBMR,calculateTDEE,calculateTargetCalories,calculateMacros,calculateCardioCalories,calculateOneRM,calculateStrengthCalories,calculateFFMI,bmiCategory,totals,meal};\n})();\n\nmodule.exports=FitCalc;\n","core/collection.js":"'use strict';\nconst KEY='fitfuel_collection_v1';\nconst CATALOG=Object.freeze([\n  Object.freeze({id:'plant',name:'窗边绿意',threshold:1,x:0,y:0,description:'把一小片绿意带回家。'}),\n  Object.freeze({id:'books',name:'周末书页',threshold:4,x:256,y:0,description:'书和热饮，留给慢下来的时刻。'}),\n  Object.freeze({id:'lamp',name:'暖灯时刻',threshold:8,x:0,y:256,description:'一盏小灯，陪你结束今天。'}),\n  Object.freeze({id:'frame',name:'山丘来信',threshold:16,x:256,y:256,description:'把探索过的心情装进画框。'})\n]);\nconst validId=id=>CATALOG.some(item=>item.id===id);\nfunction createCollection(adapter){\n  function read(){\n    const raw=adapter.getRaw(KEY);\n    if(raw===null||raw===undefined||raw==='')return {schema:2,owned:[],equipped:[],lastInspiration:0};\n    let state;try{state=typeof raw==='string'?JSON.parse(raw):raw}catch{throw Error('收藏存档无法读取，原数据已保留')}\n    const invalid=()=>{throw Error('收藏存档版本或内容不兼容，原数据已保留')};\n    if(!state||![1,2].includes(state.schema)||!Array.isArray(state.owned)||state.owned.some(id=>!validId(id))||new Set(state.owned).size!==state.owned.length||\n      !Number.isSafeInteger(state.lastInspiration)||state.lastInspiration<0)return invalid();\n    if(state.schema===1){\n      if(!(state.selected===null||state.owned.includes(state.selected))||Object.keys(state).some(key=>!['schema','owned','selected','lastInspiration'].includes(key)))return invalid();\n      // A legacy selection is projected as one placement; reading alone never rewrites it.\n      return {schema:2,owned:[...state.owned],equipped:state.selected?[state.selected]:[],lastInspiration:state.lastInspiration};\n    }\n    if(!Array.isArray(state.equipped)||state.equipped.some(id=>!state.owned.includes(id))||new Set(state.equipped).size!==state.equipped.length||\n      Object.keys(state).some(key=>!['schema','owned','equipped','lastInspiration'].includes(key)))return invalid();\n    return {...state,owned:[...state.owned],equipped:[...state.equipped]};\n  }\n  function save(state){adapter.setRaw(KEY,JSON.stringify(state));return state}\n  function project(state,notice=''){\n    return {selected:state.equipped[state.equipped.length-1]||null,equipped:[...state.equipped],equippedCount:state.equipped.length,\n      ownedCount:state.owned.length,inspiration:state.lastInspiration,notice,\n      items:CATALOG.map(item=>({...item,owned:state.owned.includes(item.id),selected:state.equipped.includes(item.id),\n        offsetX:-item.x/256*144,offsetY:-item.y/256*144}))};\n  }\n  return {\n    refresh(progress){\n      const state=read();\n      if(!progress?.enabled)return project(state,'开启成长并领取探索灵感后，收藏会在这里解锁。');\n      if(progress.clockWarning)return project(state,'时间异常，暂缓解锁；已有收藏仍保留。');\n      const count=progress.inspiration;\n      if(!Number.isSafeInteger(count)||count<state.lastInspiration)return project(state,'探索进度暂未核对，已有收藏仍保留。');\n      const owned=CATALOG.filter(item=>state.owned.includes(item.id)||count>=item.threshold).map(item=>item.id);\n      const next={...state,owned,lastInspiration:count};\n      if(JSON.stringify(next)!==JSON.stringify(state))save(next);\n      return project(next);\n    },\n    equip(id){\n      const state=read();\n      if(id!==null&&(!validId(id)||!state.owned.includes(id)))throw Error('这件收藏尚未解锁');\n      if(id===null){if(!state.equipped.length)return project(state);return project(save({...state,equipped:[]}))}\n      if(state.equipped.includes(id))return project(state);\n      return project(save({...state,equipped:[...state.equipped,id]}));\n    },\n    unequip(id){\n      const state=read();\n      if(!validId(id)||!state.owned.includes(id))throw Error('这件收藏尚未解锁');\n      if(!state.equipped.includes(id))return project(state);\n      return project(save({...state,equipped:state.equipped.filter(value=>value!==id)}));\n    }\n  };\n}\nmodule.exports={KEY,CATALOG,createCollection};\n","core/data.js":"\"use strict\";\nconst FitData = {\n  \"CATEGORY_NAMES\": {\n    \"chest\": \"胸部\",\n    \"back\": \"背部\",\n    \"shoulders\": \"肩部\",\n    \"legs\": \"腿部\",\n    \"arms\": \"手臂\",\n    \"core\": \"核心\",\n    \"quads\": \"股四头\",\n    \"hamstrings\": \"腘绳肌\",\n    \"glutes\": \"臀\",\n    \"calves\": \"小腿\",\n    \"biceps\": \"二头\",\n    \"triceps\": \"三头\",\n    \"forearms\": \"前臂\",\n    \"compound\": \"复合动作\"\n  },\n  \"EXERCISES\": [\n    {\n      \"id\": \"bench_press\",\n      \"name\": \"杠铃卧推\",\n      \"category\": \"chest\",\n      \"muscles\": [\n        \"胸大肌\",\n        \"前三角\",\n        \"肱三头肌\"\n      ],\n      \"met\": 6,\n      \"desc\": \"发展胸大肌整体厚度的黄金复合动作。\",\n      \"steps\": [\n        \"仰卧平凳，双眼位于杠铃正下方，肩胛后缩下沉\",\n        \"握距略宽于肩，下放至胸骨中下缘，前臂垂直地面\",\n        \"胸肌发力推起至手臂接近伸直\"\n      ],\n      \"mistakes\": [\n        \"肘部外展90°压迫肩关节\",\n        \"臀部离凳、腰椎过度反弓\"\n      ],\n      \"tips\": \"想象把杠铃杆掰弯，下放2秒、推起1秒。\",\n      \"aliases\": [\n        \"平板卧推\",\n        \"杠铃平推\",\n        \"bench press\"\n      ],\n      \"equipment\": [\n        \"杠铃\"\n      ],\n      \"difficulty\": \"intermediate\",\n      \"movementPattern\": \"推\",\n      \"laterality\": \"双侧\",\n      \ torical only.\nfunction createFitnessEvents(adapter,committedEvents){\n  return {list:()=>committedEvents(),legacy(){\n    try{const raw=adapter.getRaw('fitfuel_events_v1');const rows=typeof raw==='string'?JSON.parse(raw||'[]'):raw;return Array.isArray(rows)?rows:[]}\n    catch{return []}\n  }};\n}\ncreateFitnessEvents.make=(descriptor,revision,operationId)=>{\n  const {recordType,recordId,date,operation}=descriptor;\n  if(!['meal','training','weight'].includes(recordType)||typeof recordId!=='string'||!recordId||\n    !['create','update','delete'].includes(operation)||!/^\\d{4}-\\d{2}-\\d{2}$/.test(date))throw Error('无效的记录事件');\n  const timestamp=new Date().toISOString(),type=recordType+(operation==='delete'?'.removed':'.saved');\n  const id=recordType+':'+recordId+':'+revision;\n  return {schemaVersion:2,id,eventId:id,type,recordType,recordId,sourceId:recordId,revision,operationId,operation,\n    date,recordLocalDate:date,occurredAt:timestamp,updatedAt:timestamp,timezoneOffsetMinutes:-new Date().getTimezoneOffset()};\n};\nmodule.exports=createFitnessEvents;\n","core/food-model.js":"\"use strict\";\nconst FitFood = (() => {\n  const numeric = value => value !== '' && value !== null && value !== undefined && Number.isFinite(Number(value));\n  const round = (value,d=6) => Math.round(value*10**d)/10**d;\n  function normalize(input) {\n    const name=String(input.name||'').trim(), brand=String(input.brand||'').trim();\n    if (!name || name.length>60) throw Error('请输入 1–60 字的食物名称');\n    const cat=input.cat||input.category;\n    if (!FitData.FOOD_CATEGORIES.includes(cat)) throw Error('请选择食物分类');\n    if (!['per100g','serving'].includes(input.servingMode)) throw Error('请确认数据基准：每100g 或每份');\n    const servingWeight=input.servingMode==='serving' ? Number(input.servingWeight) : (numeric(input.servingWeight)?Number(input.servingWeight):null);\n    if (input.servingMode==='serving' && (!numeric(input.servingWeight)||servingWeight<=0||servingWeight>3000)) throw Error('每份重量必须大于 0 且不超过 3000 g');\n    if (servingWeight!==null && (!(servingWeight>0)||servingWeight>3000)) throw Error('请填写有效的每份重量');\n    const energyUnit=input.energyUnit||'kcal';\n    if (!['kcal','kJ'].includes(energyUnit)) throw Error('请确认能量单位');\n    const values={};\n    for (const key of ['kcal','protein','fat','carb']) {\n      if (!numeric(input[key])||Number(input[key])<0) throw Error('请确认并填写有效的热量、蛋白质、脂肪和碳水');\n      values[key]=Number(input[key]);\n    }\n    const sourceNutrition={...values,energyUnit,servingMode:input.servingMode,servingWeight};\n    if (energyUnit==='kJ') values.kcal/=4.184;\n    const ratio=input.servingMode==='serving'?100/servingWeight:1;\n    for (const key of Object.keys(values)) values[key]=round(values[key]*ratio);\n    if (values.kcal>1000 || ['protein','fat','carb'].some(k=>values[k]>100) || values.protein+values.fat+values.carb>100.01) throw Error('折算为每100g后的营养数据超出范围，请检查份量和单位');\n    const gi=input.gi===''||input.gi===null||input.gi===undefined?null:Number(input.gi);\n    if (gi!==null && (!Number.isFinite(gi)||gi<0||gi>100)) throw Error('GI 请填写 0–100，或留空');\n    return {id:input.id||'',name,brand,cat,category:cat,...values,gi,servingMode:input.servingMode,servingWeight,\n      aliases:Array.isArray(input.aliases)?input.aliases.map(String).filter(Boolean):String(input.aliases||'').split(/[,，]/).map(s=>s.trim()).filter(Boolean),\n      notes:String(input.notes||'').slice(0,1000),custom:true,sourceNutrition,recognition:input.recognition||null,\n      createdAt:input.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};\n  }\n  function grams(food,quantity,unit='grams') {\n    if (!numeric(quantity)||Number(quantity)<=0) throw Error('请输入大于 0 的份量');\n    let amount=Number(quantity);\n    if (unit==='servings') {\n      if (!numeric(food.servingWeight)||food.servingWeight<=0) throw Error('该食物没有每份重量，请按克记录');\n      amount*=food.servingWeight;\n    } else if (unit!=='grams') throw Error('请选择克数或份数');\n    if (amount>3000) throw Error('单条记录请勿超过 3000 g');\n    return round(amount,3);\n  }\n  function formValues(food) {\n    if (!food) return {name:'',brand:'',cat:'其他',servingMode:'per100g',servingWeight:'',energyUnit:'kcal',kcal:'',protein:'',fat:'',carb:'',gi:'',aliases:'',notes:''};\n    return {...food,...(food.sourceNutrition||{}),gi:food.gi??'',aliases:(food.aliases||[]).join('，'),servingWeight:food.servingWeight??'',energyUnit:food.sourceNutrition?.energyUnit||'kcal'};\n  }\n  return {normalize,grams,formValues,numeric};\n})();\n\nmodule.exports=FitFood;\n","core/game.js":"'use strict';\n\n// Trial economy is separate from health facts and animation consumption.\nconst KEY='fitfuel_game_v1',VERSION='trial-20261019';\nconst RULES=Object.freeze({version:VERSION,trainingXP:20,mealXP:10,xpPerLevel:100,unitMs:15*60*1000,maxUnits:32});\nconst own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);\nconst copy=x=>JSON.parse(JSON.stringify(x));\nconst object=x=>x&&typeof x==='object'&&!Array.isArray(x);\nconst integer=x=>Number.isSafeInteger(x)&&x>=0;\nconst timestamp=x=>integer(x)&&x<=8640000000000000;\nconst id=x=>typeof x==='string'&&x.length>0&&x.length<=200;\nfunction validDay(day){return typeof day==='string'&&/^\\d{4}-\\d{2}-\\d{2}$/.test(day)&&!Number.isNaN(Date.parse(day))&&new Date(day+'T00:00:00Z').toISOString().slice(0,10)===day}\nfunction localDay(time,offset){return new Date(time+offset*60000).toISOString().slice(0,10)}\nfunction localTime(time){const d=new Date(time),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`}\nfunction units(trip,time){return Math.min(RULES.maxUnits,Math.floor(Math.max(0,Math.min(trip.endedAt??time,time)-trip.startedAt)/RULES.unitMs))}\nfunction validate(state){\n  const bad=()=>{throw Error('游戏进度版本或内容异常，已保留原数据；请勿清除存储')};\n  if(!object(state)||state.schemaVersion!==1||state.rulesVersion!==VERSION||!timestamp(state.enabledAt)||\n    !timestamp(state.highWaterMs)||state.highWaterMs<state.enabledAt||!object(state.cursor)||!integer(state.cursor.count)||\n    (state.cursor.count===0?state.cursor.lastId!==null:!id(state.cursor.lastId))||!Array.isArray(state.awards)||!Array.isArray(state.trips))bad();\n  const keys=new Set(),trips=new Set();let active=0;\n  for(const a of state.awards){\n    if(!object(a)||!validDay(a.day)||!['meal','training'].includes(a.kind)||a.amount!==RULES[a.kind+'XP']||\n      !id(a.recordId)||!id(a.eventId)||!Number.isSafeInteger(a.revision)||a.revision<1||!timestamp(a.awardedAt)||\n      a.awardedAt<state.enabledAt||a.awardedAt>state.highWaterMs||keys.has(a.day+':'+a.kind))bad();\n    keys.add(a.day+':'+a.kind);\n  }\n  for(const [index,t] of state.trips.entries()){\n    if(!object(t)||!id(t.id)||trips.has(t.id)||!timestamp(t.startedAt)||t.startedAt<state.enabledAt||t.startedAt>state.highWaterMs||\n      (t.endedAt!==null&&(!timestamp(t.endedAt)||t.endedAt<t.startedAt||t.endedAt>state.highWaterMs))||\n      !integer(t.claimedUnits)||t.claimedUnits>RULES.maxUnits||!Array.isArray(t.claims))bad();\n    if(t.endedAt===null){active++;if(index!==state.trips.length-1)bad()}\n    trips.add(t.id);let through=0,lastTime=t.startedAt;\n    for(const c of t.claims){\n      if(!object(c)||!timestamp(c.claimedAt)||c.claimedAt<lastTime||c.claimedAt>state.highWaterMs||\n        (t.endedAt!==null&&c.claimedAt>t.endedAt)||!integer(c.throughUnit)||c.throughUnit<=through||\n        c.throughUnit>units(t,c.claimedAt)||c.amount!==c.throughUnit-through)bad();\n      through=c.throughUnit;lastTime=c.claimedAt;\n    }\n    if(through!==t.claimedUnits)bad();\n  }\n  if(active>1||!Number.isSafeInteger(state.awards.reduce((n,a)=>n+a.amount,0))||!Number.isSafeInteger(state.trips.reduce((n,t)=>n+t.claimedUnits,0)))bad();\n  return state;\n}\nfunction sourceView(source){\n  if(!object(source)||!Array.isArray(source.events)||!Array.isArray(source.meals)||!Array.isArray(source.training))throw Error('无法读取已保存记录，游戏进度暂不更新');\n  const latest=new Map(),eventIds=new Set();\n  for(const e of source.events){\n    const time=Date.parse(e?.occurredAt);\n    if(!e||e.schemaVersion!==2||!id(e.eventId)||eventIds.has(e.eventId)||!id(e.recordId)||\n      !['meal','training','weight'].includes(e.recordType)||!Number.isSafeInteger(e.revision)||e.revision<1||\n      !['create','update','delete'].includes(e.operation)||!validDay(e.recordLocalDate)||!timestamp(time)||\n      !Number.isInteger(e.timezoneOffsetMinutes)||Math.abs(e.timezoneOffsetMinutes)>840)throw Error('记录事件无法核对，已暂停游戏结算');\n    eventIds.add(e.eventId);const key=e.recordType+':'+e.recordId,old=latest.get(key);\n    if(!old||old.revision<e.revision)latest.set(key,e);\n  }\n  const refs=new Map();\n  for(const [kind,rows] of [['meal',source.meals],['training',source.training]])for(const row of rows){\n    if(row&&id(row.id)&&validDay(row.date))refs.set(kind+':'+row.id,row);\n  }\n  return {events:source.events,latest,refs};\n}\nfunction reconcile(state,source,time){\n  const {events,latest,refs}=source,cursor=state.cursor;\n  if(events.length<cursor.count||(cursor.count&&events[cursor.count-1]?.eventId!==cursor.lastId))throw Error('记录历史发生替换，已暂停游戏结算并保留进度');\n  const days=new Set(state.awards.map(a=>a.day+':'+a.kind));\n  for(const e of events.slice(cursor.count)){\n    const occurred=Date.parse(e.occurredAt);\n    if(occurred>time)throw Error('记录时间晚于当前设备时间，请校正时间后重试');\n    if(e.operation!=='create'||!['meal','training'].includes(e.recordType)||occurred<state.enabledAt||\n      e.recordLocalDate!==localDay(occurred,e.timezoneOffsetMinutes))continue;\n    const latestEvent=latest.get(e.recordType+':'+e.recordId),record=refs.get(e.recordType+':'+e.recordId),daily=e.recordLocalDate+':'+e.recordType;\n    if(days.has(daily)||latestEvent.operation==='delete'||!record||record.date!==e.recordLocalDate||latestEvent.recordLocalDate!==e.recordLocalDate)continue;\n    days.add(daily);state.awards.push({day:e.recordLocalDate,kind:e.recordType,amount:RULES[e.recordType+'XP'],recordId:e.recordId,\n      eventId:e.eventId,revision:e.revision,awardedAt:time});\n  }\n  state.cursor={count:events.length,lastId:events.at(-1)?.eventId||null};\n}\nfunction project(state,source,time){\n  if(!state)return {enabled:false,rules:RULES};\n  const clockWarning=time<state.highWaterMs,active=state.trips.find(t=>t.endedAt===null),xp=state.awards.reduce((n,a)=>n+a.amount,0);\n  const ledger=state.awards.map(a=>{\n    const event=source.latest.get(a.kind+':'+a.recordId),ref=source.refs.get(a.kind+':'+a.recordId);\n    const status=!ref||event?.operation==='delete'?'原记录已删除，保留当日一次奖励':event?.revision>a.revision?'原记录已更正，奖励不变':'已保存记录';\n    return {key:a.eventId,day:a.day,title:a.kind==='training'?'当天首次训练记录':'当天首次饮食记录',amount:a.amount,status,recordId:a.recordId,revision:a.revision};\n  }).reverse();\n  const claimLedger=state.trips.flatMap(t=>t.claims.map(c=>({key:t.id+':'+c.throughUnit,tripId:t.id,amount:c.amount,\n    at:new Date(c.claimedAt).toISOString(),timeLabel:localTime(c.claimedAt),throughUnit:c.throughUnit}))).reverse();\n  const earned=active?units(active,time):0;\n  return {enabled:true,rules:RULES,xp,level:Math.floor(xp/RULES.xpPerLevel)+1,levelXP:xp%RULES.xpPerLevel,\n    inspiration:state.trips.reduce((n,t)=>n+t.claimedUnits,0),clockWarning,\n    trip:active?{id:active.id,startedAt:active.startedAt,claimedUnits:active.claimedUnits,earnedUnits:clockWarning?active.claimedUnits:earned,\n      pendingUnits:clockWarning?0:Math.max(0,earned-active.claimedUnits),capped:!clockWarning&&earned===RULES.maxUnits,\n      nextUnitAt:active.startedAt+(Math.min(earned,RULES.maxUnits-1)+1)*RULES.unitMs}:null,\n    rewardCount:ledger.length,recentAwards:ledger.slice(0,10),claimCount:claimLedger.length,recentClaims:claimLedger.slice(0,10)};\n}\nmodule.exports=function createGame(adapter,readSource,{now=Date.now}={}){\n  function load(){\n    let raw;try{raw=adapter.getRaw(KEY)}catch{throw Error('无法读取游戏进度，请重试；原数据已保留')}\n    if(raw===null||raw===undefined||raw==='')return null;\n    let state;try{state=typeof raw==='string'?JSON.parse(raw):copy(raw)}catch{throw Error('游戏进度无法解析，已保留原数据')}\n    return validate(state);\n  }\n  function run(action){\n    const old=load(),time=now();if(!timestamp(time))throw Error('无法读取当前时间');\n    if(!old&&action?.type!=='ENABLE'){if(!action)return project(null,null,time);throw Error('请先开启成长与探索')}\n    const source=sourceView(readSource());\n    if(old&&time<old.highWaterMs){if(action)throw Error('设备时间早于上次打开时间，请校正时间后重试');return project(old,source,time)}\n    const state=old?copy(old):{schemaVersion:1,rulesVersion:VERSION,enabledAt:time,highWaterMs:time,\n      cursor:{count:source.events.length,lastId:source.events.at(-1)?.eventId||null},awards:[],trips:[]};\n    state.highWaterMs=time;reconcile(state,source,time);\n    if(action?.type==='START'){\n      if(!id(action.id))throw Error('无效的探索编号');\n      if(!state.trips.some(t=>t.id===action.id)&&!state.trips.some(t=>t.endedAt===null))state.trips.push({id:action.id,startedAt:time,endedAt:null,claimedUnits:0,claims:[]});\n    }else if(['CLAIM','FINISH'].includes(action?.type)){\n      const trip=state.trips.find(t=>t.id===action.id);if(!trip)throw Error('未找到这次探索，请刷新进度');\n      if(trip.endedAt===null){\n        const throughUnit=units(trip,time),amount=throughUnit-trip.claimedUnits;\n        if(amount>0){trip.claims.push({claimedAt:time,throughUnit,amount});trip.claimedUnits=throughUnit}\n        if(action.type==='FINISH')trip.endedAt=time;\n      }\n    }else if(action&&action.type!=='ENABLE')throw Error('不支持的游戏操作');\n    validate(state);const view=project(state,source,time);\n    if(JSON.stringify(old)!==JSON.stringify(state))try{adapter.setRaw(KEY,JSON.stringify(state))}catch{throw Error('游戏进度未确认保存，请重试核对；健康记录不受影响')}\n    return view;\n  }\n  return {refresh:()=>run(),enable:()=>run({type:'ENABLE'}),start:tripId=>run({type:'START',id:tripId}),\n    claim:tripId=>run({type:'CLAIM',id:tripId}),finish:tripId=>run({type:'FINISH',id:tripId})};\n};\nmodule.exports.RULES=RULES;\nmodule.exports.KEY=KEY;\n","core/index.js":"\"use strict\";\nconst data=require('./data'),calc=require('./calculator'),food=require('./food-model');\nconst adapter={getRaw:k=>wx.getStorageSync(k)||null,setRaw:(k,v)=>wx.setStorageSync(k,v)};\nconst store=require('./storage')(adapter,data,calc,food);\nconst events=require('./fitness-events')(adapter,()=>store.recordEvents());\nconst avatar=require('./avatar-controller')(adapter,()=>events.list());\nconst game=require('./game')(adapter,()=>({events:events.list(),meals:store.list('meals'),training:store.list('history')}));\nconst appearance=require('./appearance').createAppearance(adapter);\nconst collection=require('./collection').createCollection(adapter);\nmodule.exports={data,calc,food,store,events,avatar,game,appearance,collection};\n","core/record-commands.js":"\"use strict\";\n\nmodule.exports=function recordCommands({ledger,list,profile,today,validDate,uid,foods,resetDailyTraining,FitData,FitCalc,FitFood}){\n  const transact=(id,request,prepare)=>ledger.transact(id,JSON.stringify(request),prepare);\n  const event=(recordType,recordId,date,operation)=>({recordType,recordId,date,operation});\n  function recent(kind,id){\n    const key='recent_'+kind,rows=list(key),old=rows.find(x=>x.id===id)||{id,count:0},now=new Date().toISOString();\n    return {[key]:[{...old,count:(old.count||0)+1,lastUsedAt:now,...(kind==='exercises'?{addedAt:now}:{})},...rows.filter(x=>x.id!==id)].slice(0,kind==='foods'?60:40)};\n  }\n  function makeMeal(f,quantity,unit,slot,date){\n    if(!f)throw Error('食物已不存在，请重新选择');\n    if(!['早餐','午餐','晚餐','加餐'].includes(slot)||!validDate(date))throw Error('请确认餐次和日期');\n    const grams=FitFood.grams(f,quantity,unit);\n    return {...FitCalc.meal(f,grams,slot,date),foodId:f.id,foodName:f.name,brand:f.brand||'',mealType:slot,\n      servings:unit==='servings'?Number(quantity):null,quantity:Number(quantity),unit,servingWeight:f.servingWeight||null,\n      nutritionPer100g:Object.fromEntries(['kcal','protein','fat','carb'].map(k=>[k,f[k]]))};\n  }\n  function addFoodMeal(foodId,quantity,unit='grams',slot='早餐',date=today(),operationId=uid()){\n    return transact(operationId,['meal.create',foodId,Number(quantity),unit,slot,date],()=>{\n      const row=makeMeal(foods().find(f=>f.id===foodId),quantity,unit,slot,date);\n      return {values:{meals:[...list('meals'),row],...recent('foods',foodId)},result:row,record:row,event:event('meal',row.id,date,'create')};\n    });\n  }\n  function editMeal(id,patch,operationId=uid()){\n    if(!patch||typeof patch!=='object'||Object.keys(patch).some(k=>!['foodId','quantity','unit','slot','date'].includes(k)))throw Error('请提供有效的饮食修改内容');\n    const request=Object.fromEntries(Object.keys(patch).sort().map(k=>[k,patch[k]]));\n    return transact(operationId,['meal.update',id,request],()=>{\n      const all=list('meals'),old=all.find(x=>x.id===id);if(!old)throw Error('未找到饮食记录');\n      const foodId=patch.foodId??old.foodId;\n      const f=foodId===old.foodId&&old.nutritionPer100g?\n        {id:foodId,name:old.name,brand:old.brand,servingWeight:old.servingWeight,...old.nutritionPer100g}:foods().find(x=>x.id===foodId);\n      const updated={...old,...makeMeal(f,patch.quantity??old.quantity??old.grams,patch.unit??old.unit??'grams',patch.slot??old.slot,patch.date??old.date),id:old.id};\n      const keys=['date','foodId','grams','slot','unit','quantity','kcal','protein','fat','carb'];\n      if(keys.every(k=>updated[k]===old[k]))return {values:{},result:old};\n      return {values:{meals:all.map(x=>x.id===id?updated:x)},result:updated,record:updated,event:event('meal',id,updated.date,'update')};\n    });\n  }\n  function addMeal(row,operationId=uid()){\n    return transact(operationId,['meal.raw',row],()=>{\n      if(!row||typeof row.id!=='string'||!row.id||typeof row.name!=='string'||!validDate(row.date)||\n        !FitCalc.valid(row.grams,.001,30000)||!['kcal','protein','fat','carb'].every(k=>FitCalc.valid(row[k],0,30000)))throw Error('无效的饮食记录');\n      if(list('meals').some(x=>x.id===row.id))throw Error('该饮食记录已存在');\n      const saved={...row};return {values:{meals:[...list('meals'),saved]},result:true,record:saved,event:event('meal',row.id,row.date,'create')};\n    });\n  }\n  function remove(kind,key,id,operationId){\n    return transact(operationId,[kind+'.delete',id],()=>{\n      const all=list(key),old=all.find(x=>(kind==='weight'?x.date:x.id)===id);\n      if(!old)return {values:{},result:all};\n      const rows=all.filter(x=>(kind==='weight'?x.date:x.id)!==id),values={[key]:rows};\n      if(kind==='weight'&&rows.length)values.profile={...profile(),weight:rows.slice().sort((a,b)=>a.date.localeCompare(b.date)).at(-1).weight};\n      return {values,result:rows,event:event(kind,id,old.date,'delete')};\n    });\n  }\n  function normalizeItems(items){\n    if(!Array.isArray(items)||!items.length)throw Error('请提供已完成的训练内容');\n    return items.map(x=>{\n      if(!FitData.EXERCISES.some(e=>e.id===x.exId)||!FitCalc.valid(x.sets,1,30,true)||!FitCalc.valid(x.reps,1,180,true)||!FitCalc.valid(x.weight,0,500))throw Error('请输入有效组数、次数和负重');\n      return {...x,sets:Number(x.sets),reps:Number(x.reps),weight:Number(x.weight),completed:true,completedSets:Array(Number(x.sets)).fill(true)};\n    });\n  }\n  const sessionContent=row=>JSON.stringify([row.name,row.date,row.items.map(x=>[x.exId,x.sets,x.reps,x.weight])]);\n  function saveSession(id,name,date,items,operationId,request){\n    return transact(operationId,request,()=>{\n      if(!validDate(date)||typeof name!=='string'||!name.trim())throw Error('请确认训练名称和日期');\n      const all=list('history'),old=all.find(x=>x.id===id);\n      const normalized=normalizeItems(items),row={...old,id,date,type:'strength',name:name.trim(),items:normalized,\n        kcal:normalized.reduce((s,x)=>s+FitCalc.calculateStrengthCalories(FitData.EXERCISES.find(e=>e.id===x.exId),x.sets,x.reps,x.weight,profile().weight),0)};\n      if(old&&sessionContent(old)===sessionContent(row))return {values:{},result:old};\n      return {values:{history:[...all.filter(x=>x.id!==id),row]},result:row,record:row,event:event('training',id,date,old?'update':'create')};\n    });\n  }\n  function recordCompletedTraining(exId,sets,reps,weight,operationId=uid(),date=today()){\n    const items=[{exId,sets,reps,weight}];normalizeItems(items);\n    return saveSession('quick-'+operationId,'快捷训练',date,items,operationId,['training.quick',exId,Number(sets),Number(reps),Number(weight),date]);\n  }\n  function recordTraining(operationId=uid()){\n    const t=resetDailyTraining(),items=t.draft.map(x=>({...x,plannedSets:x.sets,sets:x.completedSets.filter(Boolean).length})).filter(x=>x.sets>0);\n    if(!items.length)throw Error('请先勾选已完成的训练组');\n    const id='strength-'+today()+'-'+t.draftId;\n    return saveSession(id,t.draftName,today(),items,operationId,['training.save',id,t.draftName,items]);\n  }\n  function editTraining(id,patch,operationId=uid()){\n    if(!patch||typeof patch!=='object'||Object.keys(patch).some(k=>!['name','date','items'].includes(k)))throw Error('无效的训练修改内容');\n    const request=Object.fromEntries(Object.keys(patch).sort().map(k=>[k,patch[k]]));\n    return transact(operationId,['training.update',id,request],()=>{\n      const old=list('history').find(x=>x.id===id);if(!old)throw Error('未找到训练记录');\n      if(old.type!=='strength')throw Error('当前只支持修改力量训练记录');\n      const date=patch.date??old.date,name=patch.name??old.name,items=normalizeItems(patch.items??old.items);\n      if(!validDate(date)||typeof name!=='string'||!name.trim())throw Error('请确认训练名称和日期');\n      const row={...old,date,name:name.trim(),items,kcal:items.reduce((s,x)=>s+FitCalc.calculateStrengthCalories(FitData.EXERCISES.find(e=>e.id===x.exId),x.sets,x.reps,x.weight,profile().weight),0)};\n      if(sessionContent(old)===sessionContent(row))return {values:{},result:old};\n      return {values:{history:list('history').map(x=>x.id===id?row:x)},result:row,record:row,event:event('training',id,date,'update')};\n    });\n  }\n  function saveWeight(date,weight,operationId=uid()){\n    if(!validDate(date)||date>today()||!FitCalc.valid(weight,30,300))throw Error('请输入有效日期和体重');\n    return transact(operationId,['weight.save',date,Number(weight)],()=>{\n      const all=list('weight_history'),old=all.find(x=>x.date===date);if(old&&Number(old.weight)===Number(weight))return {values:{},result:all};\n      const row={...old,date,weight:Number(weight)},rows=[...all.filter(x=>x.date!==date),row].sort((a,b)=>a.date.localeCompare(b.date));\n      return {values:{weight_history:rows,profile:{...profile(),weight:rows.at(-1).weight}},result:rows,record:row,event:event('weight',date,date,old?'update':'create')};\n    });\n  }\n  return {addMeal,addFoodMeal,editMeal,removeMeal:(id,op=uid())=>remove('meal','meals',id,op),\n    recordTraining,recordCompletedTraining,editTraining,removeTraining:(id,op=uid())=>remove('training','history',id,op),\n    saveWeight,removeWeight:(date,op=uid())=>remove('weight','weight_history',date,op),\n    recordEvents:ledger.events,operationResult:ledger.result};\n};\n","core/record-ledger.js":"\"use strict\";\nconst makeEvent=require('./fitness-events').make;\n\nmodule.exports=function createRecordLedger(adapter){\n  const key='fitfuel_records_v1',own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);\n  const copy=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));\n  function read(){\n    let raw,state;\n    try{raw=adapter.getRaw(key)}catch{throw Error('无法读取记录，请重试；不要清除应用数据')}\n    if(raw===null||raw===undefined||raw==='')return {schemaVersion:1,values:{},events:[],receipts:{}};\n    try{state=typeof raw==='string'?JSON.parse(raw):copy(raw)}catch{throw Error('记录数据损坏，已停止写入以保留原数据')}\n    if(state?.schemaVersion!==1||!state.values||Array.isArray(state.values)||typeof state.values!=='object'||\n      !Array.isArray(state.events)||!state.receipts||typeof state.receipts!=='object'||Array.isArray(state.receipts))throw Error('记录版本或结构无法读取，已保留原数据');\n    for(const k of ['meals','history','weight_history','recent_foods'])if(own(state.values,k)&&!Array.isArray(state.values[k]))throw Error('记录结构异常，已保留原数据');\n    for(const k of ['profile','quick_log_v1'])if(own(state.values,k)&&(!state.values[k]||typeof state.values[k]!=='object'||Array.isArray(state.values[k])))throw Error('记录结构异常，已保留原数据');\n    if(state.events.some(e=>!e||e.schemaVersion!==2||!['meal','training','weight'].includes(e.recordType)||\n      typeof e.recordId!=='string'||!e.recordId||!Number.isInteger(e.revision)||e.revision<1||!['create','update','delete'].includes(e.operation)))throw Error('事件记录异常，已保留原数据');\n    if(Object.values(state.receipts).some(r=>!r||typeof r.fingerprint!=='string'||!own(r,'result')))throw Error('保存回执异常，已保留原数据');\n    return state;\n  }\n  function write(state){try{adapter.setRaw(key,JSON.stringify(state))}catch{throw Error('保存失败：本地存储不可用或空间不足，请重试')}}\n  function transact(operationId,fingerprint,prepare){\n    if(typeof operationId!=='string'||!/^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,159}$/.test(operationId))throw Error('无效的操作编号');\n    const state=read();\n    if(own(state.receipts,operationId)){\n      const receipt=state.receipts[operationId];\n      if(receipt.fingerprint!==fingerprint)throw Error('操作编号已使用，但记录内容不一致；请开始下一条记录');\n      return copy(receipt.result);\n    }\n    const recipe=prepare();let event;\n    if(recipe.event){\n      const {recordType,recordId}=recipe.event;\n      const previous=state.events.slice().reverse().find(e=>e.recordType===recordType&&e.recordId===recordId);\n      event=makeEvent(recipe.event,(previous?.revision||0)+1,operationId);\n      if(recipe.record){recipe.record.revision=event.revision;recipe.record.updatedAt=event.updatedAt;if(event.operation==='create')recipe.record.createdAt=event.occurredAt}\n    }\n    const next={...state,values:{...state.values,...recipe.values},events:event?[...state.events,event]:state.events,\n      receipts:{...state.receipts,[operationId]:{fingerprint,result:copy(recipe.result)}}};\n    // Fact values, event revision and retry receipt share a single storage write.\n    write(next);return copy(recipe.result);\n  }\n  return {\n    value(name,legacy){const state=read();return own(state.values,name)?copy(state.values[name]):legacy()},\n    setValue(name,value){const state=read();write({...state,values:{...state.values,[name]:copy(value)}})},\n    transact,events:()=>copy(read().events),\n    result(id){const state=read();return own(state.receipts,id)?copy(state.receipts[id].result):undefined}\n  };\n};\n","core/storage.js":"\"use strict\";\n// Mini-program factory. Legacy keys remain intact; committed records use one document.\nconst createFitStore = function createFitStore(adapter, FitData, FitCalc, FitFood) {\n  const defaults={gender:'male',age:25,height:175,weight:70,bodyFat:15,activityLevel:1.375,goal:'maintain'};\n  const prefix='fitfuel_'; let available=true; const fallback={};\n  const ledger=require('./record-ledger')(adapter);\n  const managed=new Set(['meals','history','weight_history','profile','recent_foods','quick_log_v1']);\n  const facts=new Set(['meals','history','weight_history']);\n  function legacy(key,def,strict=false){\n    let raw;try{raw=adapter.getRaw(prefix+key)}catch{available=false;if(strict)throw Error('无法读取旧记录，请重试');return fallback[key]??def}\n    if(raw===null||raw===undefined||raw==='')return def;\n    let value;try{value=typeof raw==='string'?JSON.parse(raw):raw}catch{if(strict)throw Error('旧记录数据损坏，已停止写入');return def}\n    if(strict){\n      const isArray=['meals','history','weight_history','recent_foods'].includes(key);\n      if(isArray?!Array.isArray(value):!value||typeof value!=='object'||Array.isArray(value))throw Error('旧记录结构异常，已停止写入并保留原数据');\n    }\n    return value;\n  }\n  function get(key,def){return managed.has(key)?ledger.value(key,()=>legacy(key,def,true)):legacy(key,def)}\n  function set(key,value){\n    if(facts.has(key))return false; // Health facts must go ne=\"gym\" bindtap=\"selectZone\" disabled=\"{{projection.activity !== 'idle'}}\" aria-pressed=\"{{selectedZone === 'gym'}}\">训练区<\/button>\n      <button class=\"hotspot meal {{selectedZone === 'meal' ? 'selected' : ''}}\" data-zone=\"meal\" bindtap=\"selectZone\" disabled=\"{{projection.activity !== 'idle'}}\" aria-pressed=\"{{selectedZone === 'meal'}}\">餐桌<\/button>\n      <button class=\"hotspot rest {{selectedZone === 'rest' ? 'selected' : ''}}\" data-zone=\"rest\" bindtap=\"selectZone\" disabled=\"{{projection.activity !== 'idle'}}\" aria-pressed=\"{{selectedZone === 'rest'}}\">休息角<\/button>\n    <\/view>\n  <\/view>\n  <view wx:if=\"{{canvasError}}\" class=\"error\" role=\"alert\">房间画面暂未载入，记录功能仍可使用。<button bindtap=\"retry\">重新打开房间<\/button><\/view>\n  <view class=\"scene-status\"><view class=\"status\">{{status}}<\/view><view class=\"subtitle description\">{{description}}<\/view><\/view>\n  <view class=\"actions\">\n    <button wx:if=\"{{projection.activity === 'idle' && selectedZone !== 'meal' && selectedZone !== 'rest'}}\" data-action=\"PREPARE\" bindtap=\"act\">开始陪练<\/button>\n    <button wx:if=\"{{projection.activity === 'idle' && selectedZone === 'meal'}}\" bindtap=\"record\">记录这一餐<\/button>\n    <button wx:if=\"{{projection.activity === 'idle' && selectedZone === 'rest'}}\" data-zone=\"home\" bindtap=\"selectZone\">回到房间中央<\/button>\n    <button wx:if=\"{{projection.activity === 'preparing'}}\" data-action=\"START\" bindtap=\"act\">准备好了，开始<\/button>\n    <button wx:if=\"{{projection.activity === 'training'}}\" data-action=\"REST\" bindtap=\"act\">休息60秒<\/button>\n    <button wx:if=\"{{projection.activity === 'resting'}}\" data-action=\"CONTINUE\" bindtap=\"act\">继续陪练<\/button>\n    <button wx:if=\"{{projection.activity === 'paused'}}\" data-action=\"RESUME\" bindtap=\"act\">恢复陪练<\/button>\n    <button class=\"secondary\" wx:if=\"{{projection.activity !== 'idle' && projection.activity !== 'paused'}}\" data-action=\"PAUSE\" bindtap=\"act\">暂停<\/button>\n text class=\"swatch\" style=\"background:{{item.color}}\"><\/text>{{item.label}}<\/button><\/view>\n    <view class=\"option-label\">运动上衣<\/view><view class=\"choices\"><button wx:for=\"{{options.shirt}}\" wx:key=\"id\" class=\"choice {{draft.shirt === item.id ? 'active' : ''}}\" data-field=\"shirt\" data-value=\"{{item.id}}\" bindtap=\"chooseLook\" aria-pressed=\"{{draft.shirt === item.id}}\"><text class=\"swatch\" style=\"background:{{item.color}}\"><\/text>{{item.label}}<\/button><\/view>\n    <view class=\"option-label\">裤装配色<\/view><view class=\"choices\"><button wx:for=\"{{options.pants}}\" wx:key=\"id\" class=\"choice {{draft.pants === item.id ? 'active' : ''}}\" data-field=\"pants\" data-value=\"{{item.id}}\" bindtap=\"chooseLook\" aria-pressed=\"{{draft.pants === item.id}}\"><text class=\"swatch\" style=\"background:{{item.color}}\"><\/text>{{item.label}}<\/button><\/view>\n    <view class=\"option-label\">人物轮廓<\/view><view class=\"choices\"><button wx:for=\"{{options.build}}\" wx:key=\"id\" class=\"choice {{draft.build === item.id ? 'active' : ''}}\" data-field=\"build\" data-value=\"{{item.id}}\" bindtap=\"chooseLook\" aria-pressed=\"{{draft.build === item.id}}\">{{item.label}}<\/button><\/view>\n    <view class=\"editor-note\">这里的轮廓只是外观选择，不评判身材，也不影响营养和训练计算。<\/view>\n    <view class=\"actions editor-actions\"><button bindtap=\"saveLook\">保存外观<\/button><button class=\"secondary\" bindtap=\"cancelLook\">收起编辑<\/button><\/view>\n  <\/view>\n  <view class=\"saved\" wx:if=\"{{appearanceStatus}}\" role=\"status\">{{appearanceStatus}}<\/view>\n<\/view>\n","components/companion/index.wxss":":host{display:block}.companion{margin:8rpx 0 34rpx;color:#edf7ed}.heading{display:flex;justify-content:space-between;gap:14rpx;align-items:flex-start;padding:0 6rpx 16rpx}.name{font-size:32rpx;font-weight:650;line-height:1.5}.subtitle{font-size:23rpx;color:#afc9ba;line-height:1.6}.edit-button{background:transparent;color:#9cebc9;border:1rpx solid #4b7866;border-radius:10rpx;pad

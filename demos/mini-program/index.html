8rpx;background:#193228;color:#dceade;border:2rpx solid #44604e;border-radius:12rpx;font-size:24rpx;line-height:78rpx;min-width:128rpx;padding:0 16rpx;margin:0}.choice.active{border-color:#a0f0c4;background:#2d503b;color:#f6fff3;text-decoration:underline;text-underline-offset:5rpx}.swatch{display:inline-block;flex-shrink:0;width:24rpx;height:24rpx;border:1rpx solid #b5c9ae;border-radius:50%}.saved{font-size:24rpx;color:#a0f0c4;margin:20rpx 6rpx 0}.editor-actions{padding:0}.companion button::after{border:0}\n.companion .portrait-wrap{margin:20rpx 0 24rpx;background:#19372a;border-radius:20rpx}.companion .portrait{display:block;width:100%;height:390rpx}.companion .gym{left:8%;top:46%}.companion .meal{left:66%;top:42%}\n","components/companion/scene.js":"'use strict';\nconst MAP=require('../../assets/life/parts');\nconst Look=require('../../core/appearance');\nconst {CATALOG}=require('../../core/collection');\nconst ZONES={home:{x:770,y:785},gym:{x:535,y:635},meal:{x:915,y:650},rest:{x:1110,y:740}};\n// These anchors belong to the 1536x1024 room artwork and scale with the scene.\nconst DECOR_SLOTS=Object.freeze({\n  plant:Object.freeze({x:260,y:560,width:225,height:225,depth:770}),\n  books:Object.freeze({x:765,y:225,width:155,height:155,depth:360}),\n  lamp:Object.freeze({x:930,y:212,width:155,height:155,depth:354}),\n  frame:Object.freeze({x:475,y:660,width:210,height:210,depth:850})\n});\nfunction decorationLayers(view={}){\n  const ids=Array.isArray(view.decorations)&&view.decorations.length?view.decorations:view.decor?[view.decor]:[];\n  return CATALOG.filter(item=>ids.includes(item.id)).map(item=>({...item,sourceX:item.x,sourceY:item.y,...DECOR_SLOTS[item.id]})).sort((a,b)=>a.depth-b.depth);\n}\nconst rgb=hex=>[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));\n\n// Color changes happen once on an isolated cache canvas, never in the animation loop.\nfunction tintAtlas(ctx,image,look){\n  const [w,h]=MAP.atlasSize;ctx.clearRect(0,0,w,h);ctx.drawImage(image,0,0,w,h);\n  const frame=ctx.getImageData(0,0,w,h),pixels=frame.data,original=pixels.slice();\n  const isSkin=(r,g,b)=>r>g*1.12&&g>b*1.04&&r>85&&g>48;\n  function paint(name,material){\n    const [x,y,pw,ph]=MAP.parts[name],target=rgb(Look.color(material,look[material]));\n    for(let yy=y;yy<y+ph;yy++)for(let xx=x;xx<x+pw;xx++){\n      const i=(yy*w+xx)*4;if(!pixels[i+3])continue;\n      const r=original[i],g=original[i+1],b=original[i+2];let shade;\n      if(material==='skin'){\n        if(!isSkin(r,g,b))continue;\n        shade=(r*.45+g*.40+b*.15)/184;\n      }else{\n        if(material==='pants'&&yy>y+ph*.78&&isSkin(r,g,b))continue;\n        const l=r*.27+g*.57+b*.16;\n        shade=material==='hair' ? .4+l/93 : material==='pants' ? .4+l/95 : l/228;\n      }\n      for(let c=0;c<3;c++)pixels[i+c]=Math.max(0,Math.min(255,Math.round(target[c]*shade)));\n    }\n  }\n  if(look.skin!=='peach')for(const name of ['head','arm-near','arm-far','leg-near','leg-far','shorts'])paint(name,'skin');\n  if(look.hair!=='chestnut')for(const name of ['hair-short','hair-curly','hair-ponytail','hair-long'])paint(name,'hair');\n  if(look.shirt!=='cream')paint('shirt','shirt');\n  if(look.pants!=='charcoal')paint('shorts','pants');\n  ctx.putImageData(frame,0,0);\n}\nfunction avatarPose(state,time,walking){\n  const still=['static','paused'].includes(state),wave=still?0:Math.sin(time*2.6);\n  const gait=walking?Math.sin(time*10):0;\n  return {bob:walking?Math.abs(gait)*3:wave*.6,\n    nearLeg:gait*.20,farLeg:-gait*.20,\n    nearArm:state==='training' ? -.35-(Math.sin(time*3.2)+1)*.48 : state==='eating' ? -.9 : state==='completed' ? -1.2 : state==='preparing' ? -.25 : gait*-.18+wave*.012,\n    farArm:state==='training' ? .22+(Math.sin(time*3.2)+1)*.35 : gait*.15,\n    tilt:state==='eating' ? -.045 : state==='completed' ? .04 : wave*.008};\n}\nfunction drawHuman(ctx,atlas,x,y,state,time,look,walking=false,flip=false){\n  const p=avatarPose(state,time,walking),broad=look.build==='broad' ? 1.14 : look.build==='slender' ? .91 : 1;\n  function part(name,x,y,w,h){const r=MAP.parts[name];ctx.drawImage(atlas,...r,x,y,w,h)}\n  function limb(name,x,y,w,h,angle,shoe){\n    ctx.save();ctx.translate(x,y);ctx.rotate(angle);part(name,-w/2,-3,w,h);\n    if(shoe)part(shoe,-w*.8,h-11,42,28);ctx.restore();\n  }\n  ctx.save();ctx.translate(x,y);ctx.scale(flip?-1.34:1.34,1.34);\n  ctx.fillStyle='rgba(30,38,24,.25)';ctx.beginPath();ctx.ellipse(0,-3,48,14,0,0,Math.PI*2);ctx.fill();\n  ctx.save();ctx.translate(0,-p.bob);\n  limb('arm-far',25*broad,-152,25,91,p.farArm);\n  limb('leg-far',16*broad,-58,23,52,p.farLeg,'shoe-far');\n  limb('leg-near',-15*broad,-56,25,53,p.nearLeg,'shoe-near');\n  part('shorts',-34*broad,-98,68*broad,47);\n  part('shirt',-42*broad,-160,81*broad,74);\n  ctx.save();ctx.translate(1,-152);ctx.rotate(p.tilt);\n  part('head',-37,-85,79,89);\n  const hair=look.hairStyle||'short';\n  const sizes={short:[-44,-100,101,76],curly:[-48,-105,105,86],ponytail:[-55,-104,111,98],long:[-49,-101,105,100]};\n  part('hair-'+hair,...sizes[hair]);ctx.restore();\n  ctx.save();ctx.translate(-33*broad,-149);ctx.rotate(p.nearArm);\n  part('arm-near',-11,-2,25,92);\n  if(['training','preparing'].includes(state))part('dumbbell',-28,64,53,35);\n  ctx.restore();\n  if(state==='eating')part('bowl',6,-115,48,45);\n  if(state==='completed'){\n    ctx.strokeStyle='#f3d18c';ctx.lineWidth=2.5;\n    for(let i=0;i<4;i++){const sx=-75+i*49,sy=-229+Math.sin(time*4+i)*7;ctx.beginPath();ctx.moveTo(sx-4,sy);ctx.lineTo(sx+4,sy);ctx.moveTo(sx,sy-4);ctx.lineTo(sx,sy+4);ctx.stroke()}\n  }\n  ctx.restore();ctx.restore();\n}\nfunction draw(ctx,width,height,state='idle',time=0,view={}){\n  ctx.clearRect(0,0,width,height);ctx.save();\n  if(!view.assets?.room||!view.assets?.atlas){ctx.restore();return}\n  const scale=Math.min(width/1536,height/1024),offsetX=(width-1536*scale)/2,offsetY=(height-1024*scale)/2;\n  ctx.translate(offsetX,offsetY);ctx.scale(scale,scale);ctx.drawImage(view.assets.room,0,0,1536,1024);\n  const position=view.position||ZONES[view.zone]||ZONES.home,layers=decorationLayers(view);\n  const paintDecor=decor=>ctx.drawImage(view.assets.decor,decor.sourceX,decor.sourceY,256,256,decor.x,decor.y,decor.width,decor.height);\n  if(view.assets.decor)for(const decor of layers)if(decor.depth<=position.y)paintDecor(decor);\n  const spot=ZONES[view.zone]||ZONES.home;\n  if(view.zone&&view.zone!=='home'){\n    ctx.fillStyle='rgba(80,201,155,.14)';ctx.strokeStyle='#71ddad';ctx.lineWidth=3;\n    ctx.beginPath();ctx.ellipse(spot.x,spot.y+3,93,34,0,0,Math.PI*2);ctx.fill();ctx.stroke();\n  }\n  drawHuman(ctx,view.assets.atlas,position.x,position.y,state,time,view.appearance||Look.initial(),view.walking,view.flip);\n  if(view.assets.decor)for(const decor of layers)if(decor.depth>position.y)paintDecor(decor);\n  ctx.restore();\n}\nfunction drawPortrait(ctx,width,height,look,assets,state='idle',time=0){\n  ctx.clearRect(0,0,width,height);if(!assets?.atlas)return;\n  ctx.save();const scale=Math.min(width/245,height/382);ctx.translate(width/2,height-22*scale);ctx.scale(scale,scale);\n  drawHuman(ctx,assets.atlas,0,0,state,time,look);ctx.restore();\n}\nmodule.exports={draw,drawPortrait,tintAtlas,avatarPose,ZONES,DECOR_SLOTS,decorationLayers};\n","components/game-panel/index.js":"'use strict';\nComponent({\n  properties:{progress:{type:Object,value:null},error:{type:String,value:''},status:{type:String,value:''},name:{type:String,value:'我的分身'}},\n  data:{details:false},\n  methods:{\n    act(event){this.triggerEvent('action',{type:event.currentTarget.dataset.action,tripId:event.currentTarget.dataset.tripId||null})},\n    toggleDetails(){this.setData({details:!this.data.details})}\n  }\n});\n","components/game-panel/index.json":"{\"component\":true}\n","components/game-panel/index.wxml":"<view class=\"game-panel\">\n  <view class=\"heading\">{{name}}的成长<text class=\"trial\">试用规则<\/text><\/view>\n  <view wx:if=\"{{error}}\" class=\"error\">{{error}}<button class=\"secondary\" data-action=\"refresh\" bindtap=\"act\">重新核对进度<\/button><\/view>\n  <block wx:if=\"{{progress && !progress.enabled}}\">\n    <view class=\"description\">每天首条新训练记录 +20经验，首条新饮食记录 +10经验。开启探索后，每15分钟积累1点灵感，每次最多8小时。<\/view>\n    <view class=\"note\">开启前的记录不补奖；休息日不扣进度。随时可以只用记录功能。<\/view>\n    <button class=\"primary\" data-action=\"enable\" bindtap=\"act\">开启成长与探索<\/button>\n  <\/block>\n  <block wx:if=\"{{progress.enabled}}\">\n    <view class=\"summary\"><view>{{name}} Lv.{{progress.level}}<view class=\"detail\">累计 {{progress.xp}} 经验<\/view><\/view><view class=\"balance\">{{progress.inspiration}}<text class=\"unit\"> 点灵感<\/text><\/view><\/view>\n    <view class=\"description\">距离下一级还需 {{progress.rules.xpPerLevel - progress.levelXP}} 经验。游戏等级不代表体能或健康水平。<\/view>\n    <view wx:if=\"{{progress.clockWarning}}\" class=\"error\">设备时间早于上次打开时间，结算已暂停。请校正时间后刷新。<\/view>\n    <view class=\"explore\">\n      <view class=\"explore-title\">{{progress.trip ? '分身正在探索' : '让分身去收集灵感'}}<\/view>\n      <view wx:if=\"{{progress.trip}}\" class=\"description\">本次待领取 {{progress.trip.pendingUnits}} 点 · 已领取 {{progress.trip.claimedUnits}} / {{progress.rules.maxUnits}} 点<\/view>\n      <view wx:if=\"{{progress.trip.capped}}\" class=\"description\">本次8小时已满。领取并结束后，可再次出发。<\/view>\n      <view wx:if=\"{{!progress.trip}}\" class=\"description\">每次探索最多积累32点灵感，完整15分钟计1点。不自动开启下一次探索。<\/view>\n      <view class=\"actions\">\n        <button wx:if=\"{{!progress.trip}}\" class=\"primary\" data-action=\"start\" bindtap=\"act\" disabled=\"{{progress.clockWarning}}\">出发探索<\/button>\n        <button wx:if=\"{{progress.trip}}\" class=\"primary\" data-action=\"claim\" data-trip-id=\"{{progress.trip.id}}\" bindtap=\"act\" disabled=\"{{progress.clockWarning || !progress.trip.pendingUnits}}\">领取灵感<\/button>\n        <button wx:if=\"{{progress.trip}}\" class=\"secondary\" data-action=\"finish\" data-trip-id=\"{{progress.trip.id}}\" bindtap=\"act\" disabled=\"{{progress.clockWarning}}\">领取并结束<\/button>\n        <button class=\"secondary\" data-action=\"refresh\" bindtap=\"act\">刷新进度<\/button>\n      <\/view>\n      <view class=\"note\">刷新或重新打开时更新。离线按本机时间推算；结束会领取完整时段，未满15分钟的部分不结转。累计领取的灵感可解锁房间收藏，不扣除灵感。<\/view>\n    <\/view>\n    <button class=\"details-button\" bindtap=\"toggleDetails\">{{details ? '收起奖励明细与规则' : '查看奖励明细与规则'}}<\/button>\n    <view wx:if=\"{{details}}\" class=\"ledger\">\n      <view class=\"ledger-title\">记录奖励 · 最近10条<\/view>\n      <view wx:if=\"{{!progress.rewardCount}}\" class=\"note\">开启后，新保存的当天首条训练和饮食记录可获得经验。历史补录、体重和修改不发经验。<\/view>\n      <view wx:for=\"{{progress.recentAwards}}\" wx:key=\"key\" class=\"entry\">\n        <view>{{item.day}} · {{item.title}}<text class=\"reward\"> +{{item.amount}}经验<\/text><\/view>\n        <view class=\"note\">{{item.status}}<\/view>\n        <view class=\"reference\">记录 {{item.recordId}} · 奖励来源版本 {{item.revision}}<\/view>\n      <\/view>\n      <view class=\"ledger-title\">探索领取 · 最近10条<\/view>\n      <view wx:if=\"{{!progress.claimCount}}\" class=\"note\">尚未领取探索成果。<\/view>\n      <view wx:for=\"{{progress.recentClaims}}\" wx:key=\"key\" class=\"entry\">\n        <view>探索灵感 <text class=\"reward\">+{{item.amount}}点<\/text><\/view><view class=\"reference\">{{item.timeLabel}} · 累计领取至第{{item.throughUnit}}段<\/view>\n      <\/view>\n      <view class=\"note\">每天首次训练+20、首次饮食+10，每100经验升1级。删除或更正获奖记录保留奖励，当天不再补发。规则版本 {{progress.rules.version}}。<\/view>\n    <\/view>\n  <\/block>\n  <view wx:if=\"{{status}}\" class=\"saved\">{{status}}<\/view>\n<\/view>\n","components/game-panel/index.wxss":":host{display:block}.game-panel{margin:28rpx 0;padding:28rpx 0;border-top:1rpx solid #345058;border-bottom:1rpx solid #345058;color:#edf5fc}.heading{font-size:32rpx;font-weight:700;display:flex;justify-content:space-between;gap:20rpx;align-items:center;margin-bottom:18rpx}.trial{font-size:21rpx;font-weight:400;color:#aacac5;white-space:nowrap}.description{font-size:25rpx;color:#b4cdc9;line-height:1.65;margin:10rpx 0}.note{font-size:22rpx;color:#aacac5;line-height:1.7;margin:10rpx 0}.summary{display:flex;justify-content:space-between;gap:24rpx;align-items:center;margin:22rpx 0}.summary>view{font-size:32rpx;font-weight:600}.summary .detail{font-size:24rpx;font-weight:400;color:#b4cdc9;margin-top:5rpx}.balance{color:#00e9a2}.unit{font-size:24rpx;font-weight:400}.explore{margin:24rpx 0 8rpx}.explore-title,.ledger-title{font-size:27rpx;font-weight:600}.actions{display:flex;flex-wrap:wrap;gap:12rpx;margin:20rpx 0}.actions button{flex:1;min-width:160rpx;margin:0}button{font-size:25rpx;line-height:82rpx;border:0;border-radius:14rpx;margin:18rpx 0;padding:0 18rpx}button::after{border:0}.primary{background:#00d99a;color:#061a15}.secondary{background:#24454a;color:#e2f7ee}button[disabled]{background:#233c43;color:#a9c5c2}.details-button{color:#67efc2;background:transparent;text-align:left;padding:0;font-size:24rpx;margin:0}.ledger{margin:10rpx 0}.ledger-title{margin:26rpx 0 12rpx}.entry{padding:14rpx 0;border-bottom:1rpx solid #2a454d;font-size:24rpx}.reward,.saved{color:#67efc2}.reference{font-size:20rpx;color:#aacac5;word-break:break-all;line-height:1.65}.error{color:#ffc8b9;font-size:24rpx;margin:12rpx 0}.saved{font-size:24rpx;margin-top:16rpx}\n","pages/profile/index.js":"const {store,avatar}=require('../../core/index');\nconst MODES=['animated','static','hidden'];\nPage({\n  data:{status:'',companionModeLabels:['允许动画','仅静态','隐藏伙伴'],companionModeIndex:0,companionLoaded:false,companionStatus:'',companionError:false},\n  onShow(){\n    const profile=store.profile();this.setData({profile,weight:String(profile.weight)});\n    this.loadCompanion();\n  },\n  loadCompanion(){\n    try{const view=avatar.refresh();this.setData({companionModeIndex:MODES.indexOf(view.displayMode),companionLoaded:true,companionStatus:'',companionError:false})}\n    catch(e){this.setData({companionLoaded:false,companionStatus:e.message,companionError:true})}\n  },\n  input(e){this.setData({weight:e.detail.value,status:''})},\n  save(){\n    try{store.saveWeight(store.today(),this.data.weight);this.setData({status:'体重已保存',profile:store.profile()})}\n    catch(e){this.setData({status:e.message})}\n  },\n  changeCompanionMode(e){\n    try{\n      const index=Number(e.detail.value);if(!Number.isInteger(index)||!MODES[index])throw Error('请选择有效的伙伴显示方式');\n      const view=avatar.setMode(MODES[index]);\n      this.setData({companionModeIndex:MODES.indexOf(view.displayMode),companionLoaded:true,companionStatus:'已保存伙伴显示偏好',companionError:false});\n    }catch(e){this.setData({companionStatus:e.message,companionError:true})}\n  }\n});\n","pages/profile/index.json":"{\"usingComponents\":{}}","pages/profile/index.wxml":"<view class=\"page\">\n  <view class=\"eyebrow\">YOUR PROFILE<\/view>\n  <view class=\"title\">认识现在的自己。<\/view>\n  <view class=\"card\">\n    <view>当前身高 {{profile.height}} cm<\/view>\n    <view>年龄 {{profile.age}} · 身体目标 {{profile.goal}}<\/view>\n    <view class=\"muted\">基础参数目前采用初始档案；完整编辑在网页版。<\/view>\n    <input type=\"digit\" value=\"{{weight}}\" placeholder=\"今日体重 kg\" bindinput=\"input\"/>\n    <button bindtap=\"save\">记录今日体重<\/button>\n    <view class=\"status\">{{status}}<\/view>\n  <\/view>\n  <view class=\"card\">\n    <view class=\"metric\">伙伴与成长<\/view>\n    <view class=\"muted\">首页可开启经验成长与探索试用。不开启游戏也能使用记录功能。<\/view>\n    <view class=\"companion-label\">伙伴显示偏好<\/view>\n    <picker range=\"{{companionModeLabels}}\" value=\"{{companionModeIndex}}\" disabled=\"{{!companionLoaded}}\" bindchange=\"changeCompanionMode\">{{companionLoaded ? companionModeLabels[companionModeIndex] : '暂时无法读取偏好'}} ▾<\/picker>\n    <view class=\"muted companion-description\">首页小燃支持动态、静态或隐藏显示。显示偏好不影响健康记录与探索进度。<\/view>\n    <view class=\"status {{companionError ? 'companion-error' : ''}}\">{{companionStatus}}<\/view>\n    <button wx:if=\"{{!companionLoaded}}\" bindtap=\"loadCompanion\">重试读取显示偏好<\/button>\n  <\/view>\n<\/view>\n","pages/profile/index.wxss":".companion-label{margin:28rpx 0 14rpx;color:#d7fff0}\n.companion-description{margin-top:16rpx}\n.companion-error{color:#ffb3a7}\n","pages/progress/index.js":"const {store}=require('../../core/index');Page({onShow(){this.setData({weights:store.weights().slice().reverse().slice(0,30),history:store.history().slice().reverse().slice(0,20)})}})","pages/progress/index.json":"{\"usingComponents\":{}}","pages/progress/index.wxml":"<view class=\"page\"><view class=\"eyebrow\">PROGRESS<\/view><view class=\"title\">看见你的坚持。<\/view><view class=\"card\"><view class=\"metric\">体重记录<\/view><view wx:if=\"{{!weights.length}}\" class=\"empty\">去档案页记录第一次体重。<\/view><view wx:for=\"{{weights}}\" wx:key=\"date\" class=\"row\"><text>{{item.date}}<\/text><text>{{item.weight}} kg<\/text><\/view><\/view><view class=\"card\"><view class=\"metric\">训练复盘<\/view><view wx:if=\"{{!history.length}}\" class=\"empty\">还没有已完成训练。<\/view><view wx:for=\"{{history}}\" wx:key=\"id\"><view>{{item.date}} · {{item.name}}<\/view><view class=\"muted\">估算消耗 {{item.kcal}} kcal<\/view><\/view><\/view><\/view>","pages/record/index.js":"const {store,data}=require('../../core/index');\nconst FORM_KEY='quick_log_v1';\n\nfunction readForms(){\n  const forms=store.get(FORM_KEY,{schemaVersion:1});\n  if(!forms||forms.schemaVersion!==1||Array.isArray(forms))throw Error('记录表单无法读取，已保留原数据，请重试');\n  for(const kind of ['meal','training']){\n    const form=forms[kind];\n    if(form!==undefined&&(!form||typeof form.id!=='string'||!/^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,159}$/.test(form.id)||\n      !form.fields||typeof form.fields!=='object'||Array.isArray(form.fields)||!store.validDate(form.fields.date)))throw Error('记录表单异常，已保留原数据');\n  }\n  return forms;\n}\n\nPage({\n  data:{query:'',foods:[],foodIndex:0,grams:'100',slotIndex:0,slots:['早餐','午餐','晚餐','加餐'],\n    exerciseIndex:0,exercises:data.EXERCISES,sets:'3',reps:'10',load:'0',status:'',\n    mealSaved:false,trainingSaved:false,mealBusy:false,trainingBusy:false},\n  onLoad(){\n    try{\n      const foods=store.foods();this.setData({foods});\n      const forms=readForms(),next={};\n      if(forms.meal){\n        const f=forms.meal.fields;\n        Object.assign(next,{foodIndex:foods.findIndex(x=>x.id===f.foodId),grams:String(f.grams),slotIndex:this.data.slots.indexOf(f.slot),\n          mealSaved:store.operationResult(forms.meal.id)!==undefined});\n      }\n      if(forms.training){\n        const f=forms.training.fields;\n        Object.assign(next,{exerciseIndex:data.EXERCISES.findIndex(x=>x.id===f.exId),sets:String(f.sets),reps:String(f.reps),load:String(f.load),\n          trainingSaved:store.operationResult(forms.training.id)!==undefined});\n      }\n      this.setData(next);\n    }catch(e){this.setData({status:e.message})}\n  },\n  input(e){this.setData({[e.currentTarget.dataset.key]:e.detail.value,status:''})},\n  search(e){const q=e.detail.value.trim();this.setData({query:q,foods:store.foods().filter(x=>x.name.includes(q)),foodIndex:0})},\n  pick(e){this.setData({[e.currentTarget.dataset.key]:Number(e.detail.value),status:''})},\n  persistIntent(kind,fields,fresh=false){\n    const forms=readForms(),previous=forms[kind];\n    if(!fresh&&previous&&store.operationResult(previous.id)!==undefined)return previous;\n    const form={id:!fresh&&previous?previous.id:store.uid(),fields:{...fields,date:!fresh&&previous?previous.fields.date:store.today()}};\n    // Save the retry identity before the fact; a committed receipt restores success after restart.\n    if(!store.set(FORM_KEY,{...forms,[kind]:form}))throw Error('保存失败：无法保存本次操作，请重试');\n    return form;\n  },\n  mealFields(){\n    const f=this.data.foods[this.data.foodIndex],grams=Number(this.data.grams),slot=this.data.slots[this.data.slotIndex];\n    if(!f)throw Error('请选择食物');\n    if(!Number.isFinite(grams)||grams<=0||grams>3000||!slot)throw Error('食用克数需大于 0 且不超过 3000 g，并请选择餐次');\n    return {foodId:f.id,grams,slot};\n  },\n  trainingFields(){\n    const sets=Number(this.data.sets),reps=Number(this.data.reps),load=Number(this.data.load),f=this.data.exercises[this.data.exerciseIndex];\n    if(!f||!Number.isInteger(sets)||sets<1||sets>30||!Number.isInteger(reps)||reps<1||reps>180||!Number.isFinite(load)||load<0||load>500)throw Error('请输入有效组数、次数和负重');\n    return {exId:f.id,sets,reps,load};\n  },\n  meal(){\n    if(this.data.mealBusy)return;\n    try{\n      const fields=this.mealFields();\n      if(this.data.mealSaved){this.setData({status:'这份饮食已保存；新增请点“再记一份”'});return}\n      this.setData({mealBusy:true});\n      const form=this.persistIntent('meal',fields),f=form.fields;\n      store.addFoodMeal(f.foodId,f.grams,'grams',f.slot,f.date,form.id);\n      this.setData({mealSaved:true,grams:String(f.grams),foodIndex:this.data.foods.findIndex(x=>x.id===f.foodId),slotIndex:this.data.slots.indexOf(f.slot),status:'饮食已保存'});\n    }catch(e){this.setData({status:e.message})}\n    finally{this.setData({mealBusy:false})}\n  },\n  training(){\n    if(this.data.trainingBusy)return;\n    try{\n      const fields=this.trainingFields();\n      if(this.data.trainingSaved){this.setData({status:'这项训练已保存；新增请点“再记一项”'});return}\n      this.setData({trainingBusy:true});\n      const form=this.persistIntent('training',fields),f=form.fields;\n      store.recordCompletedTraining(f.exId,f.sets,f.reps,f.load,form.id,f.date);\n      this.setData({trainingSaved:true,exerciseIndex:this.data.exercises.findIndex(x=>x.id===f.exId),sets:String(f.sets),reps:String(f.reps),load:String(f.load),status:'已完成的训练组已记录'});\n    }catch(e){this.setData({status:e.message})}\n    finally{this.setData({trainingBusy:false})}\n  },\n  nextMeal(){\n    try{this.persistIntent('meal',this.mealFields(),true);this.setData({mealSaved:false,status:'可以记录下一份饮食'})}\n    catch(e){this.setData({status:e.message})}\n  },\n  nextTraining(){\n    try{this.persistIntent('training',this.trainingFields(),true);this.setData({trainingSaved:false,status:'可以记录下一项训练'})}\n    catch(e){this.setData({status:e.message})}\n  }\n});\n","pages/record/index.json":"{\"usingComponents\":{}}","pages/record/index.wxml":"<view class=\"page\">\n  <view class=\"eyebrow\">QUICK LOG<\/view>\n  <view class=\"title\">今天做了什么？<\/view>\n  <view class=\"card\">\n    <view class=\"metric\">记录饮食<\/view>\n    <input placeholder=\"搜索食物\" bindinput=\"search\"/>\n    <picker range=\"{{foods}}\" range-key=\"name\" value=\"{{foodIndex}}\" bindchange=\"pick\" data-key=\"foodIndex\">{{foods[foodIndex].name || '无匹配食物'}} ▾<\/picker>\n    <input value=\"{{grams}}\" type=\"digit\" placeholder=\"食用克数\" data-key=\"grams\" bindinput=\"input\"/>\n    <picker range=\"{{slots}}\" value=\"{{slotIndex}}\" bindchange=\"pick\" data-key=\"slotIndex\">{{slots[slotIndex]}} ▾<\/picker>\n    <button bindtap=\"meal\" disabled=\"{{mealSaved || mealBusy}}\" loading=\"{{mealBusy}}\">{{mealSaved ? '这份饮食已保存' : '保存饮食'}}<\/button>\n    <view wx:if=\"{{mealSaved}}\" class=\"saved-note\">已记入饮食记录。新增一份请先点下方按钮。<\/view>\n    <button wx:if=\"{{mealSaved}}\" class=\"record-next\" bindtap=\"nextMeal\">再记一份<\/button>\n  <\/view>\n  <view class=\"card\">\n    <view class=\"metric\">记录已完成训练<\/view>\n    <picker range=\"{{exercises}}\" range-key=\"name\" value=\"{{exerciseIndex}}\" bindchange=\"pick\" data-key=\"exerciseIndex\">{{exercises[exerciseIndex].name}} ▾<\/picker>\n    <input type=\"number\" value=\"{{sets}}\" placeholder=\"组数\" data-key=\"sets\" bindinput=\"input\"/>\n    <input type=\"number\" value=\"{{reps}}\" placeholder=\"每组次数\" data-key=\"reps\" bindinput=\"input\"/>\n    <input type=\"digit\" value=\"{{load}}\" placeholder=\"负重 kg\" data-key=\"load\" bindinput=\"input\"/>\n    <button bindtap=\"training\" disabled=\"{{trainingSaved || trainingBusy}}\" loading=\"{{trainingBusy}}\">{{trainingSaved ? '这项训练已保存' : '确认已完成并记录'}}<\/button>\n    <view wx:if=\"{{trainingSaved}}\" class=\"saved-note\">仅记录本次完成的训练，不改动训练计划。<\/view>\n    <button wx:if=\"{{trainingSaved}}\" class=\"record-next\" bindtap=\"nextTraining\">再记一项<\/button>\n  <\/view>\n  <view class=\"status\">{{status}}<\/view>\n<\/view>\n","pages/record/index.wxss":".saved-note{color:#a8c4ca;font-size:28rpx;line-height:1.6}\nbutton[disabled]{background:#183b33;color:#b1e5d4}\n.record-next{background:#132b32;color:#91f3cf;border:1rpx solid #37675b}\n","pages/today/index.js":"const {store,calc,data,avatar,game,appearance,collection}=require('../../core/index');\nPage({\n  data:{collection:null,collectionError:'',collectionStatus:'',gameProgress:null,gameError:'',gameStatus:'',appearance:null,appearanceError:'',appearanceStatus:''},\n  onShow(){\n    const profile=store.profile(),meals=store.meals().filter(x=>x.date===store.today()),sum=calc.totals(meals);\n    this.setData({sum,target:Math.round(calc.calculateTargetCalories(profile)),count:meals.length,exercises:data.EXERCISES.length,foods:data.FOODS.length,date:store.today()});\n    this.refreshCompanion();\n    this.refreshGame();\n    this.loadAppearance();\n  },\n  loadAppearance(){\n    if(!appearance)return;\n    try{this.setData({appearance:appearance.read(),appearanceError:'',appearanceStatus:''})}\n    catch(error){this.setData({appearance:null,appearanceError:error.message||'分身外观暂不可用，请重试'})}\n  },\n  saveAppearance(event){\n    if(!appearance)return;\n    try{this.setData({appearance:appearance.save(event.detail.value),appearanceError:'',appearanceStatus:'外观已保存，下次回来还是这个样子'})}\n    catch(error){this.setData({appearanceError:error.message||'外观未保存，请重试',appearanceStatus:''})}\n  },\n  refreshCompanion(){\n    if(this._feedbackTimer)clearTimeout(this._feedbackTimer);\n    try{this.presentCompanion(avatar.refresh())}\n    catch(error){avatar.suspend();this.setData({companion:null,companionError:error.message||'伙伴暂不可用，请重试'})}\n  },\n  presentCompanion(companion){\n    if(this._feedbackTimer)clearTimeout(this._feedbackTimer);\n    this._feedbackTimer=null;this.setData({companion,companionError:''});\n    if(companion.feedback&&typeof setTimeout==='function')this._feedbackTimer=setTimeout(()=>this.refreshCompanion(),2500);\n  },\n  companionAction(event){\n    const type=event.detail.type;\n    if(!['PREPARE','START','REST','CONTINUE','PAUSE','RESUME','CANCEL'].includes(type))return;\n    try{const action={type};if(type==='PREPARE')action.sessionId='companion-'+Date.now()+'-'+(this._sessionSequence=(this._sessionSequence||0)+1);\n      if(type==='REST')action.seconds=60;\n      this.presentCompanion(avatar.dispatch(action));\n    }catch(error){this.setData({companionError:error.message||'状态未更新，请重试'})}\n  },\n  onHide(){if(this._feedbackTimer)clearTimeout(this._feedbackTimer);this._feedbackTimer=null;avatar.suspend()},\n  onUnload(){this.onHide()},\n  refreshGame(){\n    if(!game)return;\n    try{const progress=game.refresh();this.setData({gameProgress:progress,gameError:'',gameStatus:''});this.refreshCollection(progress)}\n    catch(error){this.setData({gameError:error.message||'游戏进度暂不可用，请重试'})}\n  },\n  gameAction(event){\n    if(!game)return;\n    const action=event.detail?.type,tripId=event.detail?.tripId;\n    if(!['enable','refresh','start','claim','finish'].includes(action))return;\n    if(action==='refresh'){this.refreshGame();return}\n    try{\n      let progress;\n      if(action==='start'){\n        this._gameStartId=this._gameStartId||'game-'+Date.now()+'-'+(this._gameSequence=(this._gameSequence||0)+1);\n        progress=game.start(this._gameStartId);\n      }else if(action==='enable')progress=game.enable();\n      else progress=game[action](tripId);\n      this._gameStartId=null;\n      this.refreshCollection(progress);\n      this.setData({gameProgress:progress,gameError:'',gameStatus:action==='enable'?'成长已开启，旧记录不补发奖励':'游戏进度已核对并保存'});\n    }catch(error){this.setData({gameError:error.message||'游戏进度未保存，请重试'})}\n  },\n  refreshCollection(progress){\n    if(!collection)return;\n    try{this.setData({collection:collection.refresh(progress),collectionError:'',collectionStatus:''})}\n    catch(error){this.setData({collectionError:error.message||'收藏未保存，请重试',collectionStatus:''})}\n  },\n  retryCollection(){this.refreshCollection(this.data.gameProgress)},\n  equipCollection(event){\n    if(!collection)return;\n    const id=event.currentTarget.dataset.id||null;\n    try{\n      const removing=id&&(this.data.collection?.equipped||[]).includes(id);\n      const next=removing?collection.unequip(id):collection.equip(id);\n      this.setData({collection:next,collectionError:'',collectionStatus:id?(removing?'已收回这件收藏，其他摆放保持原样':'已摆进生活间，可以继续搭配其他收藏'): '已收回全部收藏，随时可以再摆出来'});\n    }\n    catch(error){this.setData({collectionError:error.message||'摆放未保存，请重试',collectionStatus:''})}\n  },\n  record(){wx.switchTab({url:'/pages/record/index'})}\n});\n","pages/today/index.json":"{\"usingComponents\":{\"fitfuel-companion\":\"/components/companion/index\",\"fitfuel-game\":\"/components/game-panel/index\"}}\n","pages/today/index.wxml":"<view class=\"page today-page\">\n  <view class=\"today-header\"><text class=\"brand\">FitFuel<\/text><text class=\"date\">{{date}}<\/text><\/view>\n  <view class=\"title today-title\">生活，有自己的节奏。<\/view>\n  <fitfuel-companion wx:if=\"{{companion}}\" projection=\"{{companion}}\" decorations=\"{{collection.equipped || []}}\" appearance=\"{{appearance}}\" appearance-error=\"{{appearanceError}}\" appearance-status=\"{{appearanceStatus}}\" bind:action=\"companionAction\" bind:record=\"record\" bind:appearancechange=\"saveAppearance\" bind:appearanceretry=\"loadAppearance\" />\n  <view wx:if=\"{{companionError}}\" class=\"card\">{{companionError}}<button bindtap=\"refreshCompanion\">重试分身状态<\/button><\/view>\n  <view class=\"collection-room\">\n    <view class=\"collection-heading\"><view><view class=\"collection-kicker\">从探索，带回生活<\/view><view class=\"section-heading\">我的房间收藏<\/view><\/view><text class=\"collection-count\">{{collection.equippedCount || 0}} 件在房间<\/text><\/view>\n    <view class=\"collection-intro\">已收藏 {{collection.ownedCount || 0}} / 4 件，可以一起摆进房间。累计领取 1 / 4 / 8 / 16 点灵感依次解锁，不消耗灵感。<\/view>\n    <view wx:if=\"{{collection.notice}}\" class=\"collection-note\">{{collection.notice}}<\/view>\n    <view wx:if=\"{{collectionError}}\" class=\"collection-error\">{{collectionError}}<button bindtap=\"retryCollection\">重新核对收藏<\/button><\/view>\n    <view class=\"collection-grid\">\n      <view wx:for=\"{{collection.items}}\" wx:key=\"id\" class=\"collection-item {{item.owned ? 'is-owned' : ''}} {{item.selected ? 'is-selected' : ''}}\">\n        <view class=\"collection-art\"><image class=\"collection-sprite\" src=\"/assets/life/decor-atlas.png\" style=\"left:{{item.offsetX}}rpx;top:{{item.offsetY}}rpx;\" /><\/view>\n        <view class=\"collection-name\">{{item.name}}<\/view><view class=\"collection-description\">{{item.description}}<\/view>\n        <view class=\"collection-threshold\">{{item.owned ? '已收藏' : item.threshold + ' 点灵感解锁'}}<\/view>\n        <button data-id=\"{{item.id}}\" data-key=\"{{'collection-' + item.id}}\" aria-pressed=\"{{item.selected}}\" aria-label=\"{{item.owned ? (item.selected ? '收回' + item.name : '摆放' + item.name) : item.name + '尚未解锁'}}\" bindtap=\"equipCollection\" disabled=\"{{!item.owned || !!collectionError}}\">{{item.selected ? '收回这件' : item.owned ? '摆进房间' : '等待探索'}}<\/button>\n      <\/view>\n    <\/view>\n    <button wx:if=\"{{collection.ownedCount}}\" class=\"collection-clear\" data-key=\"collection-clear\" bindtap=\"equipCollection\" disabled=\"{{!!collectionError}}\">全部收回<\/button>\n    <view wx:if=\"{{collectionStatus}}\" class=\"collection-note\">{{collectionStatus}}<\/view>\n  <\/view>\n  <view class=\"daily-data\"><view class=\"section-heading\">今天，留下了这些记录<\/view><view class=\"card\"><view class=\"muted\">今日已记录饮食<\/view><view class=\"big\">{{sum.kcal}} <text class=\"kcal-unit\">kcal<\/text><\/view><view class=\"muted\">参考目标 {{target}} kcal<\/view><view class=\"row\"><view>蛋白质<view class=\"metric\">{{sum.protein}}g<\/view><\/view><view>碳水<view class=\"metric\">{{sum.carb}}g<\/view><\/view><view>脂肪<view class=\"metric\">{{sum.fat}}g<\/view><\/view><\/view><button bindtap=\"record\">记录一餐 / 一次训练<\/button><\/view><\/view>\n  <fitfuel-game progress=\"{{gameProgress}}\" error=\"{{gameError}}\" status=\"{{gameStatus}}\" name=\"{{appearance.name || '我的分身'}}\" bind:action=\"gameAction\" />\n  <view class=\"source-note\">{{exercises}} 个动作 · {{foods}} 种食物<view>每次记录，都算认真生活过的证据。<\/view><\/view>\n<\/view>\n","pages/today/index.wxss":".today-page{padding:30rpx 26rpx 50rpx;background:#10231c;min-height:100vh;box-sizing:border-box}.today-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22rpx}.brand{font-size:30rpx;font-weight:700;color:#a0f0c4}.date{font-size:22rpx;color:#aec5b5}.today-title{font-size:44rpx;line-height:1.4;margin:12rpx 6rpx 32rpx;letter-spacing:0}.section-heading{font-size:29rpx;color:#eff6e9;font-weight:600;margin:38rpx 6rpx 16rpx}.today-page .card{background:#193128;border:0;padding:28rpx;margin:0 0 30rpx;border-radius:24rpx}.today-page .big{font-size:60rpx;color:#a0f0c4}.kcal-unit{font-size:25rpx}.today-page .muted{color:#afc9ba;font-size:24rpx}.today-page .row{margin-top:22rpx}.today-page .row>view{font-size:23rpx;color:#bdd0bf}.today-page .metric{font-size:33rpx;color:#e4f2e3}.today-page .card button{background:#a0f0c4;color:#123024;line-height:82rpx;margin:24rpx 0 0}.source-note{font-size:23rpx;color:#a3bcae;line-height:1.8;padding:24rpx 6rpx 8rpx}\n\n.collection-room{margin-top:32rpx;padding:28rpx;border-radius:28rpx;background:#20392d;border:1rpx solid #3a5540}.collection-heading{display:flex;align-items:center;justify-content:space-between}.collection-kicker{color:#bdd1aa;font-size:21rpx;letter-spacing:2rpx}.collection-heading .section-heading{margin:9rpx 0 0;font-size:32rpx}.collection-count{font-size:24rpx;color:#cfe5ba;border:1rpx solid #547050;padding:9rpx 15rpx;border-radius:24rpx}.collection-intro,.collection-note{font-size:23rpx;line-height:1.7;color:#c4d3bb;margin-top:20rpx}.collection-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18rpx;margin-top:26rpx}.collection-item{padding:20rpx 14rpx 16rpx;border-rad

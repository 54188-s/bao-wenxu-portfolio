// Product-specific display geometry; no phone island is applied to other devices.
shape.screen=(w=140,h=260,kind='phone')=>{
const x=300-w/2,y=200-h/2,round=kind==='watch'?28:kind==='mac'?10:22;
let svg=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${round}" fill="#101e2d" stroke="#bdd2e6" stroke-width="3"/><rect x="${x+7}" y="${y+8}" width="${w-14}" height="${h-16}" rx="${Math.max(5,round-5)}" fill="url(#part-display)"/><path d="M${x+9} ${y+h-23}Q300 ${y+h*.5} ${x+w-9} ${y+h*.22}V${y+h-11}H${x+9}Z" fill="#86c5ff33"/>`;
if(kind==='phone')svg+=`<rect x="280" y="${y+16}" width="40" height="8" rx="4" fill="#06131f"/>`;
if(kind==='xr')svg+=`<path d="M267 ${y+7}h66v11q0 8-8 8h-50q-8 0-8-8Z" fill="#06131f"/>`;
if(kind==='mac')svg+=`<path d="M285 ${y+7}h30v12h-30Z" fill="#06131f"/>`;
if(kind==='ipad')svg+=`<circle cx="300" cy="${y+4}" r="2" fill="#0b131d"/>`;
if(kind==='watch')svg+='<circle cx="300" cy="200" r="34" fill="none" stroke="#92d5ec" stroke-width="2"/><path d="M300 174v26l19 14" fill="none" stroke="#cdeeff" stroke-width="3"/>';
return svg;};
function assemblyDiagram(id,parts){
const p=product(id);let svg='';
if(p.category==='iphone')svg=shape.screen(140,260,id==='xr'?'xr':'phone');
else if(p.category==='ipad')svg=shape.screen(174,248,'ipad');
else if(p.category==='watch')svg='<rect x="272" y="80" width="56" height="244" rx="24" fill="#576d83"/><rect x="348" y="174" width="14" height="29" rx="6" fill="#b2c7d8"/>'+shape.screen(103,130,'watch');
else if(p.category==='mac')svg='<g transform="translate(0,-43)">'+shape.screen(236,165,'mac')+'</g><path d="M180 245h240l29 61q-149 14-298 0Z" fill="#a2b5c6" stroke="#d0e1ed" stroke-width="2"/>'+Array.from({length:36},(_,i)=>`<rect x="${201+i%12*17}" y="${253+Math.floor(i/12)*10}" width="13" height="7" rx="1" fill="#273b4d"/>`).join('')+'<rect x="269" y="283" width="64" height="20" rx="3" fill="#899eb1"/>';
else if(p.category==='airpods')svg=parts[0].visualAsset+'<g transform="translate(50,27) scale(.74)">'+parts.at(-1).visualAsset+'</g><g transform="translate(250,27) scale(.74)">'+parts.at(-1).visualAsset+'</g>';

else svg=parts[0].visualAsset;
return `<g class="assembly" aria-hidden="true">${svg}</g>`;}

function teardown(id,key=id){const p=product(id),parts=categoryParts(id);return `<section class="teardown" data-teardown="${key}" data-product="${id}" aria-label="${p.name} 交互式结构解析"><div class="teardown-header"><div><p class="eyebrow">结构探索 · ${parts.length} 个独立零件</p><h3>${p.name}</h3></div><span class="concept">2.5D 结构概念示意</span></div><div class="teardown-body"><div class="part-stage"><svg viewBox="0 0 600 400" role="group" aria-label="产品分层零件"><defs><linearGradient id="part-display" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132335"/><stop offset=".55" stop-color="#3882b4"/><stop offset="1" stop-color="#7fb8dd"/></linearGradient></defs>${assemblyDiagram(id,parts)}${parts.map((c,i)=>`<g class="part" tabindex="0" role="button" aria-label="${c.name}，查看零件说明" data-part="${c.id}" data-index="${i}" style="--x:${c.explodedPosition[0]}px;--y:${c.explodedPosition[1]}px;--r:${c.rotation}deg"><title>${c.name}</title>${c.visualAsset?`<g class="part-drawing">${c.visualAsset}</g>`:''}<text class="part-label" x="300" y="200" text-anchor="middle">${String(i+1).padStart(2,'0')}</text></g>`).join('')}</svg></div><aside class="part-panel" aria-live="polite"><span class="counter">探索内部设计</span><h4>让设计，层层展开。</h4><p>移入展示区域或点击「开始拆解」，探索每个零件的功能与设计。</p><p class="design-note">原创 2.5D 概念示意，不代表精确内部位置与比例。</p><div class="part-nav">${parts.map((c,i)=>`<button data-action="part" data-value="${i}" aria-pressed="false">${c.name}</button>`).join('')}</div></aside></div><div class="teardown-footer"><p>鼠标离开后恢复整机 · 触屏可点击零件查看</p><div class="actions"><button class="btn" data-action="explode" aria-pressed="false">开始拆解</button><button class="btn secondary" data-action="reset-parts">恢复整机</button><button class="icon-btn" data-action="close-part" aria-label="关闭零件介绍">${icon('close')}</button></div></div></section>`}
function setExploded(el,open){el.classList.toggle('is-open',open);const b=$('[data-action=explode]',el);b.setAttribute('aria-pressed',open);b.textContent=open?'收起拆解':'开始拆解';if(!open)resetPartInfo(el)}
function resetPartInfo(el){el.classList.remove('has-selection');$$('.part',el).forEach(p=>p.classList.remove('selected'));$$('.part-nav button',el).forEach(b=>b.setAttribute('aria-pressed','false'));const panel=$('.part-panel',el);$('.counter',panel).textContent='探索内部设计';$('h4',panel).textContent='让设计，层层展开。';$('p',panel).textContent='选择一个零件，了解功能与设计。鼠标离开区域后，所有组件自动回归整机。';$('.design-note',panel).textContent='本图是结构概念示意，不表示精确内部位置、尺度或维修步骤。'}
function selectPart(el,i){const parts=categoryParts(el.dataset.product),c=parts[i];if(!c)return;setExploded(el,true);el.classList.add('has-selection');$$('.part',el).forEach(p=>p.classList.toggle('selected',+p.dataset.index===i));$$('.part-nav button',el).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.value===i));const panel=$('.part-panel',el);$('.counter',panel).textContent=`零件 ${String(i+1).padStart(2,'0')} / ${String(parts.length).padStart(2,'0')}`;$('h4',panel).textContent=c.name;$('p',panel).textContent=c.description;$('.design-note',panel).textContent=c.designNote}

function iphoneHall(){return hallHero('iphone')+`<section class="section"><div class="container">${headline('A BRIEF DESIGN HISTORY','从触控开始，走向更多。')}<div class="insights">${[['2007—2013','触控，重新定义输入。','初代 iPhone 将多点触控带入手机；iPhone 4 用玻璃与直边框建立清晰几何。'],['2014—2020','屏幕，重新定义正面。','圆润大屏、OLED 全面屏与手势导航依次改变机身比例；iPhone 12 回归平直边缘。'],['2021—2025','材料，重新定义手感。','标准版、Pro 与 SE 等系列服务不同需求。钛金属、相机控制和 Air 的超薄架构展开新的方向。']].map(([n,t,d])=>`<article class="insight"><p class="number">${n}</p><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section><section class="section" id="air" style="padding-top:0"><div class="container">${headline('IPHONE AIR / 2025','轻薄，是一种设计语言。','把重量从体验中减去，把空间留给设计。')}${exhibit('air')}<div class="insights" style="margin-top:26px">${[['01 / MATERIAL','钛金属与连续曲线','Grade 5 钛金属框架结合镜面边缘，连续圆角让纤薄轮廓保持柔和的握持。'],['02 / ARCHITECTURE','不只是摄像头平台','顶部平台容纳相机、扬声器与 Apple 芯片，集中关键功能，为电池腾出空间。'],['03 / DISPLAY','薄，也有完整的视野','6.5 英寸 OLED 与最高 120Hz 自适应刷新，让屏幕成为轻盈机身上的主要视觉面。']].map(([n,t,d])=>`<article class="insight"><p class="number">${n}</p><h3>${t}</h3><p>${d}</p></article>`).join('')}</div><div id="air-teardown" style="margin-top:36px">${teardown('air')}</div>${sourceLinks([['iPhone Air 技术规格',SOURCE.air],['Air 的设计与架构',SOURCE.airDesign]])}</div></section><section class="section" id="xr"><div class="container">${headline('IPHONE XR / 2018','色彩，让科技拥有温度。','一款熟悉的经典，也是一段关于圆角、玻璃与色彩的设计记忆。')}${exhibit('xr')}<div id="xr-teardown" style="margin-top:36px">${teardown('xr')}</div>${sourceLinks([['iPhone XR 技术规格',SOURCE.xr],['2018 发布资料',SOURCE.xrNews]])}</div></section><section class="section"><div class="container">${headline('A DIALOGUE ACROSS TIME','Air 与 XR，设计的对话。')}<div class="comparison"><table><caption style="text-align:left;padding:20px 24px;font-size:14px">2025 与 2018 · 设计资料对照</caption><thead><tr><th scope="col">设计维度</th><th scope="col">iPhone Air</th><th scope="col">iPhone XR</th></tr></thead><tbody>${[['时代','2025 · 超薄结构与高集成度','2018 · 多彩的全面屏'],['线条','平直框架、连续圆角','圆润边框、柔和过渡'],['框架材质','Grade 5 钛金属','铝金属'],['背板','Ceramic Shield','玻璃'],['色彩','天蓝、浅金、云白、深空黑','蓝、黄、珊瑚、红、白、黑'],['摄像头','48MP Fusion · 顶部横向平台','12MP 广角 · 单摄'],['厚度 / 重量','5.6 毫米 / 165 克','8.3 毫米 / 194 克'],['屏幕','6.5 英寸 OLED，ProMotion','6.1 英寸 LCD，Liquid Retina'],['处理器','A19 Pro','A12 Bionic']].map(r=>`<tr>${r.map((v,i)=>i===0?`<th scope="row">${v}</th>`:`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:15px">厚度不包含摄像头凸起。两款产品处于不同设计时代，参数比较不代表购买建议。</p></div></section><section class="section" id="collection"><div class="container">${headline('THE IPHONE ARCHIVE','那些改变过手感的 iPhone。','从初代、直边、圆润大屏到全面屏与 Pro。每件展品都保留所属年份。')}<div class="tabs" aria-label="iPhone 系列筛选"><button class="tab active" data-action="iphone-filter" data-value="all">全部</button><button class="tab" data-action="iphone-filter" data-value="classic">经典设计</button><button class="tab" data-action="iphone-filter" data-value="modern">现代系列</button></div><div class="catalog" id="iphone-catalog">${PRODUCTS.filter(p=>p.category==='iphone').map(productCard).join('')}</div></div></section>`}
const HALL_INSIGHTS={mac:[['形态','从便携到工作站','Air 强调便携与安静，Pro 着重持续负载；iMac 将屏幕和计算机整合，mini、Studio、Pro 则保留独立桌面主机形态。'],['演变','从楔形到平直','MacBook Air 从标志性的楔形轮廓走向均匀厚度。桌面 Mac 通过体积、风道和扩展能力建立各自的比例。'],['接口','为工作流留出位置','键盘、触控板、MagSafe、Thunderbolt 和其他接口共同构成真实工作体验；数量和类型必须以具体年份为准。']],ipad:[['画布','尺寸回应使用方式','mini 适合随身阅读；标准 iPad 服务日常学习；Air 提供大画布；Pro 将显示与专业性能进一步结合。'],['场景','阅读、记下、创作','触控适合浏览，Pencil 更接近纸笔，键盘则服务文字工作。选择的首先是输入动作。'],['兼容','Pencil 并非通用','2024 Pro、M2 Air 与 A17 Pro mini 可用 Pencil Pro；iPad 第十代不兼容 Pencil Pro。']],watch:[['佩戴','科技与身体相遇','圆角表壳减少边缘侵入感，表带决定贴合与触感。尺寸、材质和活动场景一起影响舒适性。'],['输入','小屏幕，也有多种路径','触控、数码表冠、侧边按钮和受支持的手势互补，避免把所有动作塞入屏幕。'],['感知','传感器服务日常理解','光学心率和运动传感器记录活动。不同型号、地区与软件版本提供不同功能。']],airpods:[['形态','开放与密封','AirPods 4 为开放式，Pro 2 采用硅胶耳塞密封；Max 通过耳垫包覆耳朵。声学条件因此不同。'],['声音','降噪是一套系统','麦克风、芯片、驱动单元与密封共同工作。AirPods 4 标准款不具备主动降噪。'],['舒适','佩戴也是工业设计','耳塞轮廓、耳柄位置、耳垫材质与头带受力，都会改变长时间佩戴体验。']],vision:[['输入','眼睛、双手与语音','注视选择目标，轻捏完成动作，语音辅助输入。其交互围绕空间而非固定平面展开。'],['显示','从面板到光学','双 micro-OLED 经光学系统为双眼呈现画面；外部显示和眼动感知承担不同功能。'],['佩戴','不止一块曲面玻璃','遮光罩、头带、声音单元和外置电池共同构成佩戴系统，需要合适的贴合。']],accessories:[['输入','熟悉动作的新延伸','Pencil 延续笔的握持，键盘保持清晰按键，Mouse 将点击和触控滚动整合在一个表面。'],['连接','磁吸让定位可感知','MagSafe 通过磁力辅助线圈对齐。设备是否具备磁环、适配器与充电器版本都会影响体验。'],['兼容','细节决定能否协同','Touch ID 键盘需兼容 Apple Silicon Mac，Pencil 版本对应指定 iPad，配件名称相近也可能不能混用。']]};
function otherHall(k){const list=PRODUCTS.filter(p=>p.category===k),selected=state.selected[k];const demo={mac:'macbook-air',ipad:'ipad-pro',watch:'watch-series',airpods:'airpods-pro',vision:'vision-pro',accessories:'pencil'}[k];return hallHero(k)+`<section class="section" id="collection"><div class="container">${headline('FIND YOUR FORM',k==='mac'?'找到你的创造力。':k==='ipad'?'选择你的画布。':k==='watch'?'不同生活，同样精密。':k==='airpods'?'声音的三种形态。':k==='vision'?'让计算，走入空间。':'小物件，完整的设计。','按年份回看，每一代都有自己的设计。')}<div class="tabs" aria-label="选择产品型号">${list.map(p=>`<button class="tab" data-action="model" data-category="${k}" data-id="${p.id}" aria-pressed="${p.id===selected}">${p.name}</button>`).join('')}</div><div id="selected-exhibit">${exhibit(selected)}</div></div></section><section class="section" style="padding-top:0"><div class="container"><div class="insights">${HALL_INSIGHTS[k].map(([n,t,d])=>`<article class="insight"><p class="number">${n}</p><h3>${t}</h3><p>${d}</p></article>`).join('')}</div></div></section><section class="section" id="structure-teardown"><div class="container">${headline('ANATOMY OF DESIGN','从功能，找到结构。',`结构解析固定采用 ${product(demo).name} 为案例；其他型号的内部结构不与此混用。`)}${teardown(demo)}${sourceLinks([['对应机型官方资料',product(demo).source]])}</div></section>${k==='accessories'?`<section class="section" style="padding-top:0"><div class="container">${headline('COMPATIBILITY MATTERS','连接之前，先看兼容。')}<div class="comparison"><table><thead><tr><th>配件</th><th>设备关系</th><th>需要注意</th></tr></thead><tbody><tr><td>Apple Pencil Pro</td><td>指定 iPad Pro / Air / mini</td><td>第十代 iPad 不兼容；以官方列表为准</td></tr><tr><td>Magic Keyboard · Touch ID</td><td>兼容 Apple Silicon Mac</td><td>这是 Mac 键盘，不是 iPad 保护壳键盘</td></tr><tr><td>MagSafe 充电器</td><td>兼容的 iPhone 与 Qi 设备</td><td>XR 支持 Qi，不含磁吸定位环</td></tr><tr><td>Magic Mouse</td><td>兼容的 Mac</td><td>本展品为 Lightning 版本；充电时不可使用</td></tr></tbody></table></div>${sourceLinks([['Pencil 兼容列表',SOURCE.pencil],['MagSafe 使用条件',product('magsafe').source]])}</div></section>`:''}<section class="section"><div class="container">${headline('THE COLLECTION','把喜欢的设计，带入收藏。')}<div class="catalog">${list.map(productCard).join('')}</div></div></section>`}

<script>

[1976,'Apple I','电路板，是起点。','Apple 创立于 1976 年。Apple I 以组装好的主板形式迈出第一步，外壳、键盘与显示设备仍由使用者准备。它代表个人计算从爱好者电子工程走向产品的早期阶段。','apple-i','https://www.apple.com/newsroom/2026/03/apple-to-celebrate-50-years-of-thinking-different/','创立：1976 年 4 月 1 日；本节点不将创立日期当作 Apple I 发布日。'],
[1984,'Macintosh','把计算，变成可见的动作。','1984 年 1 月 24 日，Macintosh 登场。图形界面、鼠标与一体式机身，让个人计算成为更直观的日常活动。','macintosh','https://www.apple.com/mac/','产品发布：1984 年 1 月 24 日。'],
[1998,'iMac','透明与色彩，打开新局面。','1998 年 5 月 6 日发布的 iMac，以半透明外壳、一体机形态与明显的色彩，改变了桌面计算机的视觉印象。','imac-1998','https://www.apple.com/ca/fr/press/1998/05/iMac.html','这里使用发布日；上市为另一事件。'],
[2001,'iPod','音乐，成为随身的物件。','2001 年 10 月 23 日，iPod 发布。小巧白色外壳、机械滚轮与清晰的曲目浏览方式，让数字音乐拥有便携形态。','ipod','https://www.apple.com/newsroom/2001/10/23Apple-Presents-iPod/','初代为机械滚轮，不与后来的 Click Wheel 混用。'],
[2007,'iPhone','触控，重新定义正面。','2007 年 1 月 9 日发布的初代 iPhone，把手机、音乐播放器与互联网通信整合到一个多点触控界面。','iphone-original',product('iphone-original').source,'发布：2007 年 1 月 9 日；并非上市日期。'],
[2010,'iPad','一块更大的触控画布。','2010 年 1 月 27 日，首代 iPad 发布。9.7 英寸屏幕和 A4 芯片，为阅读、浏览与轻量创作带来新的设备尺度。','ipad','https://www.apple.com/newsroom/2010/01/27Apple-Launches-iPad/','照片用于后续形态对照：图中为第十代 iPad，并非首代。'],
[2015,'Apple Watch','计算，从手中走向手腕。','Apple Watch 于 2014 年发布、2015 年上市。数码表冠、小屏信息与可替换表带，让交互和佩戴第一次紧密组合。','watch-series','https://www.apple.com/newsroom/2015/03/09Apple-Watch-Available-in-Nine-Countries-on-April-24/','上市：2015 年 4 月 24 日；图为后续 Series 9，展示形态延续。'],
[2020,'Apple Silicon · M1','软硬件，共同写下新篇。','2020 年 11 月 10 日，M1 发布。SoC 与统一内存架构将多个计算功能整合，Mac 开始进入 Apple Silicon 时代。','macbook-air','https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/','图为后续 M3 MacBook Air，展示 Apple Silicon 时代的设计演变。'],
[2024,'Apple Vision Pro','界面，进入真实空间。','2023 年 6 月发布，2024 年 2 月 2 日在美国上市。初代 Vision Pro 用眼睛、双手和语音组织空间中的计算体验。','vision-pro',SOURCE.vision,'本节点年份为首发上市年份；发布年份为 2023。'],

function historyDetail(){const [y,n,t,d,id,url,note]=HISTORY[state.history];const historical=['apple-i','macintosh','imac-1998','ipod'].includes(id);return `<div class="history-detail"><div>${historical?`<img src="assets/${id}.webp" alt="${n} 历史产品照片" data-fallback="${n}">`:photo(id)}</div><div><div class="big-year">${y}</div><p class="eyebrow" style="margin-top:20px">${n}</p><h2>${t}</h2><p>${d}</p><p class="small" style="margin-top:18px">${note}</p>${sourceLinks([['历史资料',url]])}</div></div>`}
function historyPage(){return storyTitle('history','沿着时间，<br>看见改变。','从一块电路板，到一片数字空间。十个节点，回望产品形态如何改变我们与科技的关系。')+`<section class="section" style="padding-top:10px"><div class="container"><div class="timeline" role="tablist" aria-label="历史节点">${HISTORY.map(([y,n],i)=>`<button class="time-node ${i===state.history?'active':''}" role="tab" data-action="history" data-value="${i}" aria-selected="${i===state.history}"><strong>${y}</strong><span>${n}</span></button>`).join('')}</div><div id="history-detail">${historyDetail()}</div><div class="actions"><button class="btn secondary" data-action="history-prev">前一个节点</button><button class="btn secondary" data-action="history-next">后一个节点</button></div><p class="small muted" style="margin-top:22px">横向滚动时间轴，或使用方向键选择。每个节点分别标明发布与上市，避免把两个时间混为一谈。</p></div></section>`}
const CHIP_INFO={cpu:['CPU · 通用计算','执行程序指令、组织任务和处理系统逻辑。性能核心与能效核心在支持的芯片中协同工作，回应不同负载。','核心数量和架构依具体芯片而定，不从示意面积推导性能。'],gpu:['GPU · 图形与并行计算','处理界面合成、三维图形与可并行任务。Apple 芯片把 GPU 纳入 SoC，与其他单元协同。','芯片型号、核心配置和应用支持共同影响实际体验。'],ne:['Neural Engine · 神经网络','为受支持的机器学习任务提供专门计算资源，例如图像分析与部分智能处理。','不是所有机器学习任务都只在 Neural Engine 上运行。'],memory:['统一内存 · 共享数据','在采用统一内存架构的芯片中，多个计算单元共享同一内存池，减少重复搬运。','内存容量依配置而定；概念图中的方块并非真实裸片布局。'],media:['媒体引擎 · 编解码','专门的硬件对支持的音视频格式进行编解码，减轻通用计算单元负担。','支持格式与引擎数量依具体型号而定。'],secure:['Secure Enclave · 安全隔离','独立安全子系统保护敏感数据与相关密钥，服务设备的安全功能。','安全依赖整体软硬件体系，不能只靠单一组件。'],io:['I/O · 输入与输出','协调存储、显示、外部连接等数据通路，把芯片与完整设备连接起来。','图中只表达功能关系，没有精确布线。']};
function chipText(k='cpu'){const [t,d,n]=CHIP_INFO[k];return `<span class="concept">功能架构概念图 · 非真实芯片版图</span><h2>${t}</h2><p>${d}</p><p class="small" style="margin-top:22px">${n}</p>`}
function chipsPage(){return storyTitle('chips','强大，<br>从微小处开始。','计算、图形、感知与能效。探索 Apple 自研芯片如何让产品设计与功能共同工作。')+`<section class="section" style="padding-top:0"><div class="container"><div class="m1-art"><img src="assets/m1.webp" alt="Apple M1 芯片封装外观（2020 官方图片）" loading="lazy" data-fallback="M1 芯片"><div><p class="eyebrow">M1 / 2020</p><h2>一颗芯片，<br>一段新的开始。</h2><p>Mac 的第一颗 Apple 自研芯片。SoC 把 CPU、GPU 与多种专用计算功能整合，让能效与产品形态一起被重新考虑。</p><p class="small" style="margin-top:18px">照片展示芯片封装外观；下方方块是功能关系示意，两者不代表真实裸片布局。</p></div></div><div class="chip-board"><div class="chip-visual" aria-label="芯片功能结构概念图">${[['cpu','CPU','cpu'],['gpu','GPU','gpu'],['ne','Neural Engine','ne'],['memory','统一内存','gpu'],['media','媒体引擎',''],['secure','安全隔离',''],['io','I/O','gpu']].map(([k,t,c])=>`<button class="chip-block ${c} ${k==='cpu'?'active':''}" data-action="chip" data-value="${k}" aria-pressed="${k==='cpu'}">${t}</button>`).join('')}</div><div class="chip-copy" id="chip-copy">${chipText()}</div></div></div></section><section class="section"><div class="container">${headline('A FAMILY OF PURPOSE','每一颗芯片，都有自己的任务。')}<div class="insights">${[['A SERIES','A 系列 · 移动计算','从 A4、A12 Bionic 到 A19 Pro，服务于具体世代的 iPhone 与部分 iPad。Air 的 A19 Pro 采用 5 核 GPU，不能混写为 Pro 机型的其他配置。'],['M SERIES','M 系列 · 创造与能效','M1 在 2020 年带来 Mac 的 SoC 与统一内存架构。后续 M 系列用于 Mac、部分 iPad 与 Vision Pro，不同产品选用不同版本。'],['BEYOND A & M','S、H、R 与通信芯片','S 系列 SiP 服务 Apple Watch；H 系列服务耳机音频；初代 Vision Pro 的 R1 处理感知输入；Air 还使用 N1 与 C1X。']].map(([n,t,d])=>`<article class="insight"><p class="number">${n}</p><h3>${t}</h3><p>${d}</p></article>`).join('')}</div>${sourceLinks([['M1 架构资料','https://www.apple.com/newsroom/2020/11/apple-unleashes-m1/'],['Air 芯片配置',SOURCE.air],['Vision Pro 双芯片',SOURCE.vision],['耳机芯片',SOURCE.airpods]])}</div></section><section class="section" style="padding-top:0"><div class="container">${headline('PERFORMANCE PER WATT','能效，也是一种设计材料。','更低的能耗与合理的散热需求，可以为体积、安静与电池空间创造更多选择。')}<div class="twins"><div class="design-photo">${photo('macbook-air')}<h3>无风扇，不是少画一个风扇。</h3><p>MacBook Air 的无风扇设计，需要计算能力、导热结构与目标负载共同配合。持续负载需求更高的 MacBook Pro 则采用主动散热。</p><div class="actions"><a class="text-link" href="#/mac?section=structure-teardown">了解 MacBook Air 结构</a></div></div><div class="design-photo">${photo('air','','iphone-air-profile')}<h3>轻薄，是全系统的协调。</h3><p>iPhone Air 的材料、平台架构、电池空间与能效共同参与设计。这里不编造未经核实的性能增幅或电池容量。</p><div class="actions"><a class="text-link" href="#/iphone?focus=air">了解 Air 的设计</a></div></div></div></div></section>`}
function designPage(){return storyTitle('design','少一些。<br>恰好，更多。','材质、色彩、比例与触感。优秀的工业设计，让复杂的技术以清晰而自然的方式进入生活。')+`<section class="section" style="padding-top:0"><div class="container"><div class="material-grid"><article class="material"><span class="surface-text">Ti</span><h3>钛金属</h3><p>以 Air 的框架为案例。强度、表面处理与手感一起塑造轻薄的边界。</p></article><article class="material"><span class="surface-text">Glass</span><h3>玻璃</h3><p>XR 的彩色背板与前方显示面，让光泽、触感与颜色成为同一件事。</p></article><article class="material"><span class="surface-text">Al</span><h3>铝金属</h3><p>从 XR 边框到 Mac 外壳，适合加工的材料支撑连续而精确的轮廓。</p></article></div><p class="small muted" style="margin-top:15px">以上色块为材质光感的概念表达，不是显微照片。</p><div class="design-split"><article class="design-photo">${photo('air','','iphone-air-side')}<p class="eyebrow">PROPORTION / IPHONE AIR</p><h3>轻薄，先从侧面被感知。</h3><p>均匀的薄度与独立的顶部平台，建立清晰的体积关系。纤薄机身仍需要为摄像与计算留出空间。</p><div class="actions"><a class="text-link" href="#/iphone?focus=air">查看 Air 设计案例</a></div></article><article class="design-photo">${photo('xr')}<p class="eyebrow">COLOR / IPHONE XR</p><h3>色彩，把距离感变得亲近。</h3><p>蓝、黄、珊瑚与红，与白和黑共同构成六色选择。圆润边框让色彩从背部延续到握持体验。</p><div class="actions"><a class="text-link" href="#/iphone?focus=xr">查看 XR 设计案例</a></div></article></div><div class="proportion-demo"><p class="eyebrow">INTERACTIVE PROPORTION STUDY</p><h3>用同一尺度，观察厚度。</h3><div class="proportion-bars"><div><span class="small">iPhone Air · 5.6 mm</span><div class="proportion-bar" id="air-bar" style="--width:56%;margin-top:10px"></div></div><div><span class="small">iPhone XR · 8.3 mm</span><div class="proportion-bar" id="xr-bar" style="--width:83%;margin-top:10px"></div></div></div><label class="small" for="proportion">调整展示尺度（两款保持真实厚度比例）</label><input id="proportion" type="range" min="50" max="100" value="100"><p class="small">条形长度表达机身厚度比例，不含摄像头凸起。</p></div></div></section><section class="section"><div class="container">${headline('DESIGN PRINCIPLES','从物件，到人的动作。')}<div class="insights">${[['01 / CLARITY','极简与对称','减少视觉噪声、保留清晰层级。对称帮助组织主体，但接口与摄像头仍服从真实功能。'],['02 / CONTINUITY','圆角与一体化','连续曲线连接视觉与触感；一体式外壳减少分割，同时需要兼顾制造、散热与维护。'],['03 / HUMAN INTERACTION','精密，最终服务于人','从数码表冠到磁吸定位，精密制造的价值在于让输入、佩戴与连接自然发生。']].map(([n,t,d])=>`<article class="insight"><p class="number">${n}</p><h3>${t}</h3><p>${d}</p></article>`).join('')}</div>${sourceLinks([['Air 材料与结构',SOURCE.airDesign],['XR 色彩与材质',SOURCE.xrNews],['Watch 交互',SOURCE.watch]])}</div></section>`}
const SYSTEMS=[['iOS','iPhone','手指与信息，直接相遇。','以直接触控为核心，通过主屏、通知与手势组织日常操作。设备支持的功能取决于具体系统版本与型号。',['触控与手势导航','主屏与小组件','Face ID 或 Touch ID，视机型而定'],'https://support.apple.com/guide/iphone/welcome/ios','iphone'],['macOS','Mac','让多任务，自然展开。','围绕窗口、菜单栏和键盘鼠标组织工作。触控板手势与连续互通让桌面计算连接移动设备。',['桌面窗口与菜单栏','Finder 文件管理','键盘快捷键与触控板手势'],'https://support.apple.com/guide/mac-help/welcome/mac','mac'],['iPadOS','iPad','一块画布，多种输入。','触控、Pencil 和键盘互补。多任务形式与支持能力因版本和机型而异，不能把所有高级功能视为通用。',['大屏触控','兼容型号的 Pencil 输入','受支持的多任务与外接显示'],'https://support.apple.com/guide/ipad/welcome/ipados','ipad'],['watchOS','Apple Watch','重要的信息，一瞥即可。','围绕短时查看、活动与佩戴组织体验。触控、数码表冠和兼容机型的手势承担不同操作。',['表盘与复杂功能','活动与通知','数码表冠滚动'],'https://support.apple.com/guide/watch/welcome/watchos','watch'],['visionOS','Vision Pro','界面，不再只在平面。','通过注视、双手和语音与空间窗口交互。数字内容与现实空间结合，界面的尺度与距离也成为设计因素。',['空间窗口','注视与轻捏输入','沉浸环境与透视视野'],'https://support.apple.com/guide/apple-vision-pro/welcome/visionos','vision']];
function systemView(){const [n,dev,t,d,features,url,k]=SYSTEMS[state.system];return `<div class="system-preview" style="${k==='watch'?'border-radius:70px;background:linear-gradient(140deg,#101624,#355b74)':k==='vision'?'background:radial-gradient(ellipse,#5c9eaa,#12172b)':''}"><span class="preview-label">${n.toUpperCase()} / 界面语言示意</span><div><div class="clock">${k==='watch'?'10:09':k==='mac'?'Hello.':'09:41'}</div><p style="color:#d7e8fc">${dev} · ${n}</p></div><div class="app-icons">${features.map((f,i)=>`<span aria-hidden="true">${['浏览','创作','连接'][i]}</span>`).join('')}</div><span class="preview-label">这是展示示意，不是可运行的操作系统</span></div><div class="system-copy"><p class="eyebrow">${dev} / ${n}</p><h2>${t}</h2><p>${d}</p><ul>${features.map(f=>`<li>${f}</li>`).join('')}</ul><div class="actions"><a class="btn secondary" href="#/${k}">查看对应设备</a></div>${sourceLinks([[`${n} 官方使用手册`,url]])}</div>`}
function systemsPage(){return storyTitle('systems','同一种默契，<br>不同的界面。','每种设备都有适合自己的输入方式。切换系统，探索界面语言如何回应它的硬件。')+`<section class="section" style="padding-top:0"><div class="container"><div class="tabs" role="tablist" aria-label="选择操作系统">${SYSTEMS.map((s,i)=>`<button role="tab" class="tab" data-action="system" data-value="${i}" aria-selected="${i===state.system}">${s[0]}</button>`).join('')}</div><div class="system-layout" id="system-view">${systemView()}</div></div></section><section class="section"><div class="container">${headline('THE LANGUAGE OF INTERACTION','系统，延续产品的设计。')}<div class="insights"><article class="insight"><p class="number">INPUT</p><h3>先理解输入。</h3><p>触控适合直接操作，鼠标适合精确指向，表冠回应小屏幕，眼手协作则回应空间界面。</p></article><article class="insight"><p class="number">HIERARCHY</p><h3>再组织信息。</h3><p>文字、对比、深度和留白帮助用户判断层级。界面随着观看距离与屏幕面积改变密度。</p></article><article class="insight"><p class="number">CONTINUITY</p><h3>最后连接任务。</h3><p>连续互通把设备之间的切换变得自然。协同功能仍受账号、网络、版本与硬件条件约束。</p><div class="actions"><a class="text-link" href="#/ecosystem">探索设备协作</a></div></article></div></div></section>`}
const ECO_FEATURES={iphone:[['AirDrop · 与 Mac、iPad 和 Vision Pro','受支持设备可近距离传输内容；打开 Wi-Fi 与蓝牙，并允许接收。AirDrop 不等于 iCloud 同步。'],['Handoff 与通用剪贴板','与兼容的 Mac、iPad 等接续支持的任务。同一 Apple 账号、Wi-Fi、蓝牙与 Handoff 需开启。']],mac:[['接力与通用剪贴板','与兼容 iPhone、iPad 等接续支持的应用或复制内容；同一账号并开启相应连接与 Handoff。'],['随航 · 与兼容 iPad','将受支持 iPad 用作 Mac 的扩展或镜像屏幕；需兼容机型与系统，同一账号，并满足有线或无线连接条件。'],['用 Apple Watch 解锁','受支持的 Mac 可通过已解锁且佩戴中的兼容 Apple Watch 解锁；需双重认证与相关设置。']],ipad:[['随航 · 与 Mac','兼容 iPad 可为 Mac 提供额外屏幕；并非所有旧型号与系统均支持。'],['AirDrop 与通用剪贴板','受支持的设备近距离传输或复制内容；剪贴板需同一账号与 Handoff。']],watch:[['与 iPhone 配对','手表与兼容 iPhone 配对，接收通知并管理设置；最低系统要求因具体手表型号而定。'],['解锁兼容 Mac','需要满足官方型号与系统要求、双重认证，以及 Wi-Fi 和蓝牙等条件。Watch 不提供通用 AirDrop 文件传输。']],airpods:[['设备自动切换','支持的 AirPods 可在同一 Apple 账号并启用双重认证的兼容设备间切换；需受支持的软件版本。'],['声音连接','通过蓝牙连接音频设备。蓝牙连接与自动切换的条件不同；不是任意耳机都支持 Apple 的自动切换。']],vision:[['AirDrop 与内容接续','受支持的 Vision Pro 可与附近兼容设备传输内容；需要适当的接收和网络设置。'],['Mac 虚拟显示屏','与兼容 Mac 创建虚拟屏幕；需官方支持的系统、同一账号及相关网络与认证条件。具体功能随版本变化。']]};
function ecoDetail(){return `<p class="eyebrow">CONNECTED DEVICE / ${state.eco.toUpperCase()}</p><h2>${state.eco==='watch'?'Apple Watch':state.eco==='vision'?'Vision Pro':HALLS[state.eco].title}</h2>${ECO_FEATURES[state.eco].map(([t,d])=>`<div class="eco-feature"><strong>${t}</strong><p>${d}</p></div>`).join('')}<div class="actions"><a class="text-link" href="#/${state.eco}">进入对应产品馆</a></div>`}
function ecosystemPage(){const nodes=[['iphone',50,10],['mac',85,30],['ipad',85,70],['watch',50,90],['airpods',15,70],['vision',15,30]];return storyTitle('ecosystem','各有所长。<br>一起，更自然。','点击设备，查看它与其他设备之间真实支持的协作方式，以及开始之前需要满足的条件。')+`<section class="section" style="padding-top:0"><div class="container"><div class="eco-layout"><div class="eco-map"><svg viewBox="0 0 100 100" aria-hidden="true">${nodes.map(([k,x,y])=>`<path data-edge="${k}" class="${k===state.eco?'active':''}" d="M50 50L${x} ${y}"/>`).join('')}</svg><div class="eco-center">CONTINUITY<br>连续互通</div>${nodes.map(([k,x,y])=>`<button class="eco-node" style="--left:${x}%;--top:${y}%" data-action="eco" data-value="${k}" aria-pressed="${k===state.eco}">${icon(k)}${k==='watch'?'Apple Watch':k==='vision'?'Vision Pro':HALLS[k].title}</button>`).join('')}</div><div class="eco-detail" id="eco-detail">${ecoDetail()}</div></div>${sourceLinks([['连续互通系统要求',SOURCE.continuity],['通用剪贴板条件','https://support.apple.com/en-us/102430'],['AirPods 切换设备','https://support.apple.com/en-us/104988'],['Mac 虚拟显示屏','https://support.apple.com/en-us/119942']])}<p class="small muted" style="margin-top:20px">连线表达设备参与生态，并不表示任意两台设备支持所有功能。实际兼容性请查看上述官方列表。</p></div></section>`}
function favoritesPage(){const list=PRODUCTS.filter(p=>state.favorites.has(p.id)&&(state.filter==='all'||p.category===state.filter));return storyTitle('favorites','留住你的<br>设计灵感。',`已收藏 ${state.favorites.size} 件展品。你的收藏保存在当前浏览器中，刷新后仍可继续探索。`)+`<section class="section" style="padding-top:0"><div class="container"><div class="section-head"><div class="tabs" aria-label="收藏类别筛选">${[['all','全部'],...ROUTES.filter(r=>HALLS[r[0]]).map(r=>[r[0],HALLS[r[0]].title.replace('\n','')])].map(([k,n])=>`<button class="tab" data-action="favorites-filter" data-value="${k}" aria-pressed="${state.filter===k}">${n}</button>`).join('')}</div>${state.favorites.size?'<button class="btn secondary" data-action="clear-favorites">清空收藏</button>':''}</div>${list.length?`<div class="catalog">${list.map(p=>`<div>${productCard(p)}<a class="text-link" style="display:inline-block;margin:15px 8px" href="#/${p.category}${p.id==='air'||p.id==='xr'?'?focus='+p.id:''}">返回 ${routeName(p.category)}</a></div>`).join('')}</div>`:`<div class="empty"><div class="empty-symbol">◇</div><h2>${state.favorites.size?'这个分类，还没有展品。':'<span class="empty-line">收藏，</span><span class="empty-line">从一次心动开始。</span>'}</h2><p>${state.favorites.size?'试试其他分类，或去产品馆寻找新的设计。':'浏览产品，点击「收藏 ＋」，把喜欢的形态与设计留在这里。'}</p><div class="actions" style="justify-content:center"><a class="btn" href="#/iphone">探索产品</a>${state.filter!=='all'?'<button class="btn secondary" data-action="favorites-filter" data-value="all">显示全部收藏</button>':''}</div></div>`}</div></section>`}
function aboutPage(){return storyTitle('about','因热爱，<br>而相聚。','Apple Universe · 苹果设计宇宙。一座面向苹果爱好者、工业设计爱好者与数码文化学习者的非官方数字展览馆。')+`<section class="section" style="padding-top:0"><div class="container"><div class="about-grid"><article class="about-card"><p class="eyebrow">OUR PURPOSE</p><h3>探索产品背后的设计之美。</h3><p>这里不售卖产品。我们从形态、材质、历史与交互出发，理解日常数码物件如何被设计，以及它们如何改变人的动作。</p><p>七个产品馆、发展史、芯片、设计、系统与生态展区，共同组成十五个独立的探索空间。iPhone Air 与 iPhone XR 是两件重点研究展品。</p><div class="actions"><a class="btn" href="#/home">返回首页</a><button class="btn secondary" data-action="share">分享这个展馆</button></div></article><article class="about-card"><p class="eyebrow">CONTACT & REGISTRATION</p><h3>项目联系信息</h3><dl><dt>项目名称</dt><dd>Apple Universe</dd><dt>中文名称</dt><dd>苹果设计宇宙</dd><dt>负责人</dt><dd>待填写</dd><dt>联系地址</dt><dd>待填写</dd><dt>联系邮箱</dt><dd>待填写</dd><dt>许可证／备案</dt><dd>待填写（如适用）</dd></dl><p class="small" style="margin-top:24px">没有真实联系和备案信息时保留明确栏位，不编造企业身份或号码。</p></article><article class="about-card wide"><p class="eyebrow">HOW TO EXPLORE</p><h3>浏览、观察、收藏。</h3><p>使用顶部搜索查找产品、页面或设计关键词。点开产品图片查看大图；通过型号、颜色与视角选择观察外形。在结构区域移入鼠标，或在触屏上点击「开始拆解」，再选择零件查看说明。收藏与主题偏好保存在当前浏览器。</p><p>页面的十五个入口在首页与全局菜单中均可找到。菜单和弹窗支持 Escape 关闭及键盘焦点管理，减少动态效果的系统偏好也会被尊重。</p></article><article class="about-card wide"><p class="eyebrow">TRUTH, SOURCES & RIGHTS</p><h3>资料、示意与版权说明。</h3><p>产品参数优先依据 Apple 技术规格与 Newsroom；每件展品标注所属年份，并在相关页面提供原始资料链接。这里是历代设计收藏，不能理解为全部型号的实时在售清单。</p><p>产品照片来自注明来源的公开资料，图片及商标版权属于相应权利人，公开可访问不等于获得通用再发布许可。素材清单记录原始图址和来源；未经核实授权，不将本项目视为可任意商业使用的素材包。</p><p>外观工程图、分层零件和芯片方块均为本项目原创概念示意。它们有真实的逐件交互，但不表示精确内部尺寸、电路版图或维修装配流程，也不是真实三维扫描模型。</p><p><strong style="color:var(--ink)">非官方声明：</strong>Apple 及相关产品名称属于其各自权利人。本站与 Apple Inc. 无官方关联，未获得 Apple 的认可或赞助。</p><div class="actions"><a class="btn secondary" href="assets/SOURCES.md" target="_blank">查看素材来源清单</a><a class="btn secondary" href="#/history">浏览产品发展史</a></div></article></div></div></section>`}
// 07. Hash routing, scroll restoration, cleanup and shared enhancements.
function currentRoute(){const raw=location.hash.slice(1)||'/home', [path,query='']=raw.split('?');return {route:path.replace(/^\//,''),params:new URLSearchParams(query)}}
function route(){const parsed=currentRoute();if(!ROUTES.some(r=>r[0]===parsed.route)){location.replace('#/home');return}const old=state.route;if(state.lastHash)state.scrolls[state.lastHash]=scrollY;state.cleanup.forEach(f=>f());state.cleanup=[];clearInterval(state.timer);state.timer=null;closeDialog(false);state.route=parsed.route;state.lastHash=location.hash||'#/home';document.title=`${routeName(state.route)} · Apple Universe`;$$('.desktop-nav a').forEach(a=>{if(a.hash.split('?')[0]==='#/'+state.route)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});let html;if(state.route==='home')html=home();else if(state.route==='iphone')html=iphoneHall();else if(HALLS[state.route])html=otherHall(state.route);else html=({history:historyPage,chips:chipsPage,design:designPage,systems:systemsPage,ecosystem:ecosystemPage,favorites:favoritesPage,about:aboutPage}[state.route])();$('#main').dataset.route=state.route;$('#main').innerHTML=html;$('#main').classList.remove('route-enter');void $('#main').offsetWidth;$('#main').classList.add('route-enter');syncFavorites();enhance();const target=parsed.params.get('focus')||parsed.params.get('section');requestAnimationFrame(()=>{if(target){const el=document.getElementById(target);if(el)el.scrollIntoView({behavior:'instant',block:'start'});else scrollTo(0,0)}else scrollTo({top:state.scrolls[location.hash]||0,behavior:'instant'});if(old!==state.route)$('#main').focus({preventScroll:true})});}
function enhance(){const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.remove('will-reveal');e.target.classList.add('reveal');observer.unobserve(e.target)}}),{threshold:.07});if(!matchMedia('(prefers-reduced-motion: reduce)').matches)$$('.section-head,.feature,.insight,.product-card,.teardown').forEach(el=>{el.classList.add('will-reveal');observer.observe(el)});state.cleanup.push(()=>observer.disconnect());$$('.teardown').forEach(el=>{const enter=e=>{if(e.pointerType==='mouse')setExploded(el,true)},leave=e=>{if(e.pointerType==='mouse')setExploded(el,false)},over=e=>{const p=e.target.closest('.part');if(p&&el.classList.contains('is-open')&&e.pointerType==='mouse')selectPart(el,+p.dataset.index)},focus=e=>{const p=e.target.closest('.part');if(p)selectPart(el,+p.dataset.index)};el.addEventListener('pointerenter',enter);el.addEventListener('pointerleave',leave);el.addEventListener('pointerover',over);initPartLabels(el);el.addEventListener('focusin',focus);state.cleanup.push(()=>{el.removeEventListener('pointerenter',enter);el.removeEventListener('pointerleave',leave);el.removeEventListener('pointerover',over);el.removeEventListener('focusin',focus)})});const carousel=$('.carousel');if(carousel){state.hoverPaused=false;state.touchPaused=false;carousel.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')state.hoverPaused=true});carousel.addEventListener('pointerleave',()=>state.hoverPaused=false);let start=0;carousel.addEventListener('touchstart',e=>{start=e.changedTouches[0].clientX;state.touchPaused=true},{passive:true});carousel.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>45)moveSlide(delta<0?1:-1);state.touchPaused=false},{passive:true});state.timer=setInterval(()=>{if(!state.paused&&!state.hoverPaused&&!(matchMedia('(hover: hover) and (pointer: fine)').matches&&carousel.matches(':hover'))&&!state.touchPaused&&!state.dialog&&!document.hidden&&!carousel.contains(document.activeElement))moveSlide(1)},5500)};$$('[data-tilt]').forEach(el=>{if(!matchMedia('(hover:hover) and (pointer:fine)').matches)return;el.addEventListener('pointermove',e=>{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=el.getBoundingClientRect();el.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*5+'deg');el.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*5+'deg')});el.addEventListener('pointerleave',()=>{el.style.setProperty('--ry','0deg');el.style.setProperty('--rx','0deg')})});}
function moveSlide(delta){state.slide=(state.slide+delta+SLIDES.length)%SLIDES.length;renderSlide()}
function renderSlide(){const c=$('.carousel');if(!c)return;c.innerHTML=carouselSlide();syncFavorites()}
function updateExhibit(id){const el=$(`[data-exhibit="${id}"]`);if(el){const active=document.activeElement;const action=active?.dataset.action,value=active?.dataset.value;el.outerHTML=exhibit(id);const next=$(`[data-exhibit="${id}"]`);if(action){const b=Array.from(next.querySelectorAll(`[data-action="${action}"]`)).find(x=>!value||x.dataset.value===value);b?.focus({preventScroll:true})}syncFavorites()}}

function openSearch(){openDialog('search',dialogFrame('寻找你的灵感',`<div class="search-field"><input id="search-input" type="search" placeholder="搜索产品、系列、设计关键词" aria-label="站内搜索" autocomplete="off"><button class="icon-btn" data-action="clear-search" aria-label="清空搜索">${icon('close')}</button></div><div class="results" id="search-results">${searchResults('')}</div>`))}
function imageVariants(id){return id==='air'?['iphone-air-colors','iphone-air-front','iphone-air-back','iphone-air-side','iphone-air-profile']:id==='xr'?['iphone-xr','iphone-xr-blue','iphone-xr-coral','iphone-xr-yellow','iphone-xr-red','iphone-xr-white','iphone-xr-black']:[id]}
function zoomDialog(id,index=0){const variants=imageVariants(id);state.zoom={id,index:(index+variants.length)%variants.length};const p=product(id);const labels=id==='air'?['四色正背面','正面','背面四色','侧面','薄度细节']:id==='xr'?['多彩外观','蓝色','珊瑚色','黄色','红色','白色','黑色']:['产品外观'];openDialog('zoom',dialogFrame(p.name,`<div class="lightbox">${photo(id,'',variants[state.zoom.index],true)}<p class="small muted" style="margin-top:20px">${labels[state.zoom.index]} · ${state.zoom.index+1} / ${variants.length}</p>${variants.length>1?`<div class="actions"><button class="btn secondary" data-action="zoom-prev">上一张</button><button class="btn secondary" data-action="zoom-next">下一张</button></div>`:''}<p class="small muted" style="margin-top:20px">官方产品图 · © Apple Inc. · 版权归原权利人</p></div>`))}

document.addEventListener('click',async e=>{const link=e.target.closest('a');if(link?.classList.contains('skip')){e.preventDefault();$('#main').focus();$('#main').scrollIntoView();return}if(link?.getAttribute('href')?.startsWith('#/')){closeDialog(false);if(link.hash===location.hash){e.preventDefault();route()}return}const part=e.target.closest('.part');if(part){selectPart(part.closest('.teardown'),+part.dataset.index);return}const b=e.target.closest('[data-action]');if(!b)return;const {action,id,value,category}=b.dataset;switch(action){case'menu':openMenu();break;case'search':openSearch();break;case'close-dialog':closeDialog();break;case'theme':state.theme=state.theme==='light'?'dark':'light';applyTheme();if(!storage.set('theme',state.theme))toast('浏览器未允许保存偏好，本次切换仍然有效');break;case'favorite':{const saved=state.favorites.has(id);if(saved)state.favorites.delete(id);else state.favorites.add(id);const persisted=storage.set('favorites',[...state.favorites]);syncFavorites();toast(persisted?saved?'已移出收藏':'已加入收藏':'本次已更新收藏，但浏览器未允许持久保存');if(state.route==='favorites')route();break}case'favorites-filter':state.filter=value;route();break;case'clear-favorites':openDialog('confirm',dialogFrame('清空全部收藏？',`<p>这会移除当前浏览器中保存的 ${state.favorites.size} 件展品收藏。</p><div class="actions"><button class="btn secondary" data-action="close-dialog">保留收藏</button><button class="btn" data-action="confirm-clear">确认清空</button></div>`));break;case'confirm-clear':state.favorites.clear();storage.set('favorites',[]);closeDialog(false);route();toast('收藏已清空');break;case'prev-slide':moveSlide(-1);break;case'next-slide':moveSlide(1);break;case'slide':state.slide=+value;renderSlide();break;case'pause-slide':state.paused=!state.paused;renderSlide();$('.carousel [data-action=pause-slide]')?.focus({preventScroll:true});break;case'film':{const paused=b.closest('.film').classList.toggle('paused');b.textContent=paused?'播放动画':'暂停动画';b.setAttribute('aria-pressed',paused);break}case'zoom':zoomDialog(id);break;case'zoom-prev':zoomDialog(state.zoom.id,state.zoom.index-1);break;case'zoom-next':zoomDialog(state.zoom.id,state.zoom.index+1);break;case'detail':openDetail(id);break;case'clear-search':$('#search-input').value='';$('#search-results').innerHTML=searchResults('');$('#search-input').focus();break;case'view':state.view[id]={...state.view[id],angle:value};updateExhibit(id);break;case'color':state.view[id]={...state.view[id],color:+value};updateExhibit(id);break;case'band':state.view[id]={...state.view[id],band:value};updateExhibit(id);break;case'face':state.view[id]={...state.view[id],face:state.view[id]?.face?0:1};updateExhibit(id);break;case'model':state.selected[category]=id;$('#selected-exhibit').innerHTML=exhibit(id);$$('[data-action=model]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id));syncFavorites();break;case'iphone-filter':{const list=PRODUCTS.filter(p=>p.category==='iphone'&&(value==='all'||(value==='classic'?p.year<2020:p.year>=2020)));$('#iphone-catalog').innerHTML=list.map(productCard).join('');$$('[data-action=iphone-filter]').forEach(x=>x.classList.toggle('active',x===b));syncFavorites();break}case'explode':{const el=b.closest('.teardown');setExploded(el,!el.classList.contains('is-open'));break}case'reset-parts':setExploded(b.closest('.teardown'),false);break;case'part':selectPart(b.closest('.teardown'),+value);break;case'close-part':resetPartInfo(b.closest('.teardown'));break;case'history':state.history=+value;updateHistory();break;case'history-prev':state.history=(state.history+HISTORY.length-1)%HISTORY.length;updateHistory();break;case'history-next':state.history=(state.history+1)%HISTORY.length;updateHistory();break;case'chip':$('#chip-copy').innerHTML=chipText(value);$$('[data-action=chip]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',x===b)});break;case'system':state.system=+value;$('#system-view').innerHTML=systemView();$$('[data-action=system]').forEach(x=>x.setAttribute('aria-selected',x===b));break;case'ec document.addEventListener('input',e=>{const el=e.target;if(el.id==='search-input')$('#search-results').innerHTML=searchResults(el.value);if(el.dataset.angle){const art=$('.device-angle',el.closest('[data-exhibit]'));art?.style.setProperty('--angle',el.value+'deg')}if(el.id==='proportion'){$('#air-bar').style.setProperty('--width',.56*el.value+'%');$('#xr-bar').style.setProperty('--width',.83*el.value+'%')}});
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeDialog()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.dialog){e.preventDefault();closeDialog();return}if(state.dialog&&e.key==='Tab'){const list=$$('a[href],button:not(:disabled),input,select,[tabindex="0"]',$('#overlay')).filter(x=>x.getClientRects().length);const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}return}const part=e.target.closest('.part');if(part&&['Enter',' '].includes(e.key)){e.preventDefault();selectPart(part.closest('.teardown'),+part.dataset.index)}if(e.target.matches('[data-action=history]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();state.history=(state.history+(e.key==='ArrowRight'?1:HISTORY.length-1))%HISTORY.length;updateHistory();$(`[data-action=history][data-value="${state.history}"]`).focus()}if(state.dialog==='zoom'&&['ArrowLeft','ArrowRight'].includes(e.key))zoomDialog(state.zoom.id,state.zoom.index+(e.key==='ArrowRight'?1:-1))});
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement&&e.target.dataset.fallback){const box=document.createElement('div');box.className='image-fallback';box.textContent=e.target.dataset.fallback+' · 图片无法加载';e.target.replaceWith(box)}},true);
window.addEventListener('hashchange',route);
window.addEventListener('scroll',()=>{document.body.classList.toggle('compact',scrollY>60);$('.top-button').hidden=scrollY<600},{passive:true});
document.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&matchMedia('(hover:hover) and (pointer:fine)').matches){const glow=$('.cursor-glow');glow.style.left=e.clientX+'px';glow.style.top=e.clientY+'px'}},{passive:true});
window.addEventListener('storage',e=>{if(e.key==='au-favorites'){const ids=storage.get('favorites',[]);state.favorites=new Set(Array.isArray(ids)?ids.filter(id=>product(id)):[]);if(state.route==='favorites')route();else syncFavorites()}if(e.key==='au-theme'){state.theme=storage.get('theme','light');applyTheme()}});
// 10. Initialization. No modules, fetch, CDN or server are needed for primary functions.
$('[data-action=search]').innerHTML=icon('search');$('[data-action=menu]').innerHTML=icon('menu');$('.top-button').innerHTML=icon('top');applyTheme();syncFavorites();if('scrollRestoration' in history)history.scrollRestoration='manual';route();
</script>
</body>
</html>
